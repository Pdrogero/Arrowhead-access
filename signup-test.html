<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arrowhead Access — Signup Test</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 20px; }
  input { display: block; width: 100%; padding: 10px; margin-bottom: 10px; font-size: 16px; box-sizing: border-box; }
  button { padding: 10px 20px; font-size: 16px; }
  #result { margin-top: 20px; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; }
  .ok { background: #e6f7f0; color: #0a6b45; }
  .err { background: #fde8e8; color: #a4262c; }
</style>
</head>
<body>
  <h2>Signup test — rep</h2>
  <input id="name" value="Test Rep" placeholder="name">
  <input id="companyName" value="Test Co" placeholder="companyName">
  <input id="email" value="testrep1@example.com" placeholder="email">
  <input id="password" value="testpass123" placeholder="password">
  <button onclick="testSignup()">Test signup</button>
  <div id="result"></div>

<script>
async function testSignup() {
  const resultEl = document.getElementById('result');
  resultEl.className = '';
  resultEl.textContent = 'Sending request...';
  try {
    const res = await fetch('https://arrowhead-access-api.onrender.com/api/auth/rep/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('name').value,
        companyName: document.getElementById('companyName').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    resultEl.className = res.ok ? 'ok' : 'err';
    resultEl.textContent = 'Status: ' + res.status + '\n' + JSON.stringify(data, null, 2);
  } catch (err) {
    resultEl.className = 'err';
    resultEl.textContent = 'Network error: ' + err.message;
  }
}
</script>
</body>
</html>
