<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrowhead Access</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #FAFAFA; color: #1F2937; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 32px 20px; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .sub { color: #6B7280; font-size: 14px; margin-bottom: 24px; }
    .card { background: white; border: 1px solid #E5E7EB; border-radius: 12px; padding: 24px; }
    input { width: 100%; padding: 12px; border: 1px solid #E5E7EB; border-radius: 8px; margin-bottom: 12px; font-size: 16px; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 12px; }
    .btn-primary { background: #1F2937; color: white; }
    .btn-secondary { background: #E8684A; color: white; }
    .btn-back { background: none; color: #2D6F5E; text-align: left; padding: 0; margin-bottom: 16px; }
    .error { background: #FDEAEA; color: #C23C3C; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
  </style>
</head>
<body>

<div id="app"></div>

<script>
const API = 'https://arrowhead-access-api.onrender.com';

let state = {
  screen: 'home',
  error: null
};

function setState(updates) {
  state = { ...state, ...updates };
  render();
}

function render() {
  const app = document.getElementById('app');
  
  if (state.screen === 'home') {
    app.innerHTML = `
      <div class="wrap">
        <h1>Arrowhead Access</h1>
        <p class="sub">OpenTable for medical sales visits</p>
        <div class="card">
          <button class="btn-primary" onclick="setState({screen:'office'})">Office Login</button>
          <button class="btn-secondary" onclick="setState({screen:'rep'})">Rep Login</button>
        </div>
      </div>
    `;
  }
  
  else if (state.screen === 'office') {
    app.innerHTML = `
      <div class="wrap">
        <button class="btn-back" onclick="setState({screen:'home'})">← Back</button>
        <h1>Office Login</h1>
        <div class="card">
          ${state.error ? '<div class="error">' + state.error + '</div>' : ''}
          <input id="email" type="email" placeholder="Email" value="staff@meridianfamilypractice.com">
          <input id="password" type="password" placeholder="Password" value="demo1234">
          <button class="btn-primary" onclick="doOfficeLogin()">Log In</button>
        </div>
      </div>
    `;
  }
  
  else if (state.screen === 'rep') {
    app.innerHTML = `
      <div class="wrap">
        <button class="btn-back" onclick="setState({screen:'home'})">← Back</button>
        <h1>Rep Login</h1>
        <div class="card">
          ${state.error ? '<div class="error">' + state.error + '</div>' : ''}
          <input id="email" type="email" placeholder="Email">
          <input id="password" type="password" placeholder="Password">
          <button class="btn-primary" onclick="doRepLogin()">Log In</button>
        </div>
      </div>
    `;
  }
}

async function doOfficeLogin() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  try {
    const res = await fetch(API + '/api/auth/staff/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    
    if (!res.ok) {
      const err = await res.json();
      setState({ error: err.error || 'Login failed' });
      return;
    }
    
    const data = await res.json();
    localStorage.setItem('token', data.token);
    alert('Office login successful! Token saved.');
    setState({ screen: 'home' });
  } catch (err) {
    setState({ error: err.message });
  }
}

async function doRepLogin() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  try {
    const res = await fetch(API + '/api/auth/rep/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    
    if (!res.ok) {
      const err = await res.json();
      setState({ error: err.error || 'Login failed' });
      return;
    }
    
    const data = await res.json();
    localStorage.setItem('token', data.token);
    alert('Rep login successful! Token saved.');
    setState({ screen: 'home' });
  } catch (err) {
    setState({ error: err.message });
  }
}

render();
</script>

</body>
</html>
