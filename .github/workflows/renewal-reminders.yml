name: Renewal Reminders

on:
  schedule:
    # Every 3 hours rather than once a day — GitHub's free scheduled-workflow
    # queue can delay a single daily run by several hours under load (seen
    # firing anywhere from ~13:00 to ~20:00 UTC some days), which risked a
    # same-day reminder email going out very late or not at all. All the
    # endpoints below are flag-gated (each only sends once per
    # booking/message/etc.), so running more often is safe — it just gives
    # the check more chances to land close to on time.
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

jobs:
  check-renewals:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger renewal check
        run: |
          curl -sS -f -X POST "https://arrowhead-access-api.onrender.com/api/billing/check-renewals" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
      - name: Trigger lunch reminder check
        run: |
          curl -sS -f -X POST "https://arrowhead-access-api.onrender.com/api/bookings/check-lunch-reminders" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
      - name: Trigger unread message reminder check
        run: |
          curl -sS -f -X POST "https://arrowhead-access-api.onrender.com/api/messages/check-unread-reminders" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
      - name: Trigger monthly schedule reminder check
        run: |
          curl -sS -f -X POST "https://arrowhead-access-api.onrender.com/api/bookings/check-monthly-schedule-reminders" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
      - name: Trigger expired-request check
        run: |
          curl -sS -f -X POST "https://arrowhead-access-api.onrender.com/api/bookings/check-expired-requests" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
      - name: Trigger unverified-rep reminder check
        run: |
          curl -sS -f -X POST "https://arrowhead-access-api.onrender.com/api/verification/check-unverified-reminders" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
      - name: Trigger no-plan reminder check
        run: |
          curl -sS -f -X POST "https://arrowhead-access-api.onrender.com/api/billing/check-no-plan-reminders" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
