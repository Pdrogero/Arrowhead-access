<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrowhead Access</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #FAFAFA; color: #1F2937; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 32px 20px; }
    h1 { font-size: 26px; margin-bottom: 12px; }
    p { color: #6B7280; font-size: 14px; margin-bottom: 20px; }
    .card { background: white; border: 1px solid #E5E7EB; border-radius: 12px; padding: 24px; margin-bottom: 12px; }
    .row { padding: 14px; border-bottom: 1px solid #E5E7EB; display: flex; justify-content: space-between; align-items: center; }
    .row:last-child { border-bottom: none; }
    input { width: 100%; padding: 12px; border: 1px solid #E5E7EB; border-radius: 8px; margin-bottom: 12px; font-size: 16px; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 12px; }
    .btn-primary { background: #1F2937; color: white; }
    .btn-secondary { background: #E8684A; color: white; }
    .btn-link { background: none; color: #2D6F5E; text-align: left; }
    .btn-small { width: auto; padding: 6px 12px; font-size: 12px; margin: 0; }
    .btn-approve { background: #E8F5E9; color: #2D6F5E; }
    .btn-decline { background: #FDEAEA; color: #C23C3C; }
    .chip { display: inline-block; background: #DFE7FF; color: #1F3A8A; padding: 4px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .error { background: #FDEAEA; color: #C23C3C; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    .empty { color: #6B7280; text-align: center; padding: 20px; }
  </style>
</head>
<body>

<div id="app"></div>

<script>
const API = 'https://arrowhead-access-api.onrender.com';

let state = {
  screen: 'home',
  role: null,
  user: null,
  error: null,
  ledger: []
};

function setState(newState) {
  state = { ...state, ...newState };
  render();
}

function render() {
  const app = document.getElementById('app');
  
  if (state.screen === 'home') {
    app.innerHTML = `<div class="wrap">
      <h1>Arrowhead Access</h1>
      <p>OpenTable for medical sales visits</p>
      <div class="card">
        <button class="btn-primary" onclick="setState({screen:'office'})">Office Login</button>
        <button class="btn-secondary" onclick="setState({screen:'rep'})">Rep Login</button>
      </div>
    </div>`;
  }
  
  else if (state.screen === 'office') {
    app.innerHTML = `<div class="wrap">
      <button class="btn-link" onclick="setState({screen:'home'})">← Back</button>
      <h1>Office Login</h1>
      <div class="card">
        ${state.error ? '<div class="error">' + state.error + '</div>' : ''}
        <input id="email" type="email" placeholder="Email" value="staff@meridianfamilypractice.com">
        <input id="password" type="password" placeholder="Password" value="demo1234">
        <button class="btn-primary" onclick="login('office')">Log In</button>
      </div>
    </div>`;
  }
  
  else if (state.screen === 'rep') {
    app.innerHTML = `<div class="wrap">
      <button class="btn-link" onclick="setState({screen:'home'})">← Back</button>
      <h1>Rep Login</h1>
      <div class="card">
        ${state.error ? '<div class="error">' + state.error + '</div>' : ''}
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <button class="btn-primary" onclick="login('rep')">Log In</button>
      </div>
    </div>`;
  }
  
  else if (state.screen === 'office-dashboard') {
    app.innerHTML = `<div class="wrap">
      <h1>Office Ledger</h1>
      <p>Logged in as: ${state.user.email}</p>
      <div class="card">
        ${state.ledger.length ? state.ledger.map(s => `
          <div class="row">
            <div>
              <div style="font-weight:600;">${s.booking?.rep?.name || 'Open slot'}</div>
              <div style="color:#6B7280;font-size:12px;">${new Date(s.startTime).toLocaleDateString()}</div>
            </div>
            <span class="chip">${s.status}</span>
            ${s.status === 'REQUESTED' && s.booking ? `<button class="btn-small btn-approve" onclick="approveBooking('${s.booking.id}')">✓</button>` : ''}
          </div>
        `).join('') : '<div class="empty">No bookings yet.</div>'}
      </div>
      <div class="card">
        <button class="btn-link" onclick="logout()">Log Out</button>
      </div>
    </div>`;
    loadOfficeLedger();
  }
  
  else if (state.screen === 'rep-dashboard') {
    app.innerHTML = `<div class="wrap">
      <h1>Rep Dashboard</h1>
      <p>Logged in as: ${state.user.email}</p>
      <div class="card">
        <div style="color:#6B7280;text-align:center;">Dashboard loading...</div>
      </div>
      <div class="card">
        <button class="btn-link" onclick="logout()">Log Out</button>
      </div>
    </div>`;
  }
}

async function login(role) {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  if (!email || !password) {
    setState({ error: 'Email and password required' });
    return;
  }
  
  try {
    const endpoint = role === 'office' ? '/api/auth/staff/login' : '/api/auth/rep/login';
    const res = await fetch(API + endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error || 'Login failed');
    }
    
    const data = await res.json();
    localStorage.setItem('token', data.token);
    
    setState({
      user: data,
      role: role,
      screen: role === 'office' ? 'office-dashboard' : 'rep-dashboard',
      error: null
    });
  } catch (err) {
    setState({ error: err.message });
  }
}

async function loadOfficeLedger() {
  try {
    const token = localStorage.getItem('token');
    const locationId = state.user.locationId;
    
    const res = await fetch(API + '/api/bookings/locations/' + locationId + '/ledger', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    
    const slots = await res.json();
    setState({ ledger: slots });
  } catch (err) {
    console.log('Ledger error:', err);
    setState({ ledger: [] });
  }
}

async function approveBooking(id) {
  try {
    const token = localStorage.getItem('token');
    await fetch(API + '/api/bookings/' + id + '/decide', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ decision: 'approve' })
    });
    loadOfficeLedger();
  } catch (err) {
    alert('Error: ' + err.message);
  }
}

function logout() {
  localStorage.removeItem('token');
  setState({ screen: 'home', user: null, role: null, error: null, ledger: [] });
}

render();
</script>

</body>
</html>
