    .mid{flex:1;}
    .who{font-weight:600;font-size:14px;}
    .what{font-size:12.5px;color:var(--slate);}

// ========== UTILITY ==========
async function api(path, options = {}) {
  const token = localStorage.getItem('token');
  const headers = {
    'Content-Type': 'application/json',
    ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
  };

  const res = await fetch(API_BASE + path, {
    ...options,
    headers: { ...headers, ...options.headers },
  });

  if (!res.ok) {
    const error = await res.json().catch(() => ({ error: res.statusText }));
    const err = new Error(error.error || error.message || 'API error');
    err.status = res.status;
    err.code = error.code;
    throw err;
  }

  return res.json();
}

function setState(updates) { Object.assign(state, updates); render(); }
function logout() {
  localStorage.removeItem('token');
  favoriteLocationIds = new Set();
  favoriteOfficesData = null;
  setState({ screen: 'role', role: null, me: null });
}
function goHome() {
  if (localStorage.getItem('token') && state.me) {
    setState({ screen: 'dashboard' });
  } else {
    setState({ screen: 'role', role: null, me: null });
  }
}

async function loadTwoFactorSetting() {
  try {
    const profile = await api('/api/profile/rep');
    document.getElementById('twoFactorEnabled').checked = !!profile.twoFactorEnabled;
  } catch (err) {}
}

window.saveTwoFactorSetting = async function(checked) {
  const msg = document.getElementById('twoFactorSavedMsg');
  try {
    await api('/api/profile/rep', { method: 'PATCH', body: JSON.stringify({ twoFactorEnabled: checked }) });
    msg.style.display = 'block';
    setTimeout(() => { msg.style.display = 'none'; }, 2000);
  } catch (err) {
    alert(err.message);
  }
};

              <input type="checkbox" class="browseFilterTypeCb" ${browseTypeFilter.has(t) ? 'checked' : ''} onchange="toggleBrowseTypeFilter('${t}', this.checked)">
              ${eventTypeLabel(t)}
            </label>
          `).join('')}
        </div>
      </div>
      <div id="browseContent"><div class="listcard"><div class="empty">Loading…</div></div></div>
    </div>`;
}

// All appointment types offered in the filter panel — OFFICE_CLOSED is
// excluded since it's an informational blocker, not something a rep would
// filter Open Slots by.
function browseFilterableTypes() {
  return Object.keys(EVENT_TYPE_LABELS).filter(t => t !== 'OFFICE_CLOSED');
}

// Short "(N selected)" suffix on the filter toggle button, blank when
// every type is checked (i.e. the filter isn't actually narrowing anything).
function browseFilterSummary() {
  return browseTypeFilter.size < browseFilterableTypes().length ? ` (${browseTypeFilter.size} selected)` : '';
}

window.toggleBrowseFilterPanel = function() {
  const panel = document.getElementById('browseFilterPanel');
  if (panel) panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
};

// Keeps the filter toggle button's label and the "Select all" checkbox's
// own checked state in sync after any change to browseTypeFilter, whether
// that came from an individual checkbox or the "Select all" one itself.
function syncBrowseFilterUi() {
  const btn = document.getElementById('browseFilterToggleBtn');
  if (btn) btn.textContent = `🎚️ Appointment type${browseFilterSummary()}`;
  const selectAll = document.getElementById('browseFilterSelectAll');
  if (selectAll) selectAll.checked = browseTypeFilter.size === browseFilterableTypes().length;
}

window.toggleBrowseTypeFilter = function(type, checked) {
  if (checked) browseTypeFilter.add(type); else browseTypeFilter.delete(type);
  syncBrowseFilterUi();
  renderBrowseContent();
};

window.toggleBrowseFilterSelectAll = function(checked) {
  browseTypeFilter = new Set(checked ? browseFilterableTypes() : []);
  document.querySelectorAll('#browseFilterPanel .browseFilterTypeCb').forEach(cb => { cb.checked = checked; });
  syncBrowseFilterUi();
  renderBrowseContent();
};

const EVENT_TYPE_LABELS = {
  REP_VISIT: 'Rep visit',
  LUNCH: 'Lunch',
  BREAKFAST: 'Breakfast',
  COFFEE_SNACK: 'Coffee/Snack',
  STAFF_TRAINING: 'Staff training',
  OFFICE_CLOSED: 'Office closed',
};

// Distinct colors per event type so it's scannable at a glance, separate
// from the green/amber/red palette already used for booking/transfer status.
const EVENT_TYPE_COLORS = {
  REP_VISIT: { bg: '#DFE7FF', color: '#1F3A8A' },
  LUNCH: { bg: '#FDECE7', color: '#C2410C' },
  BREAKFAST: { bg: '#FEF9C3', color: '#854D0E' },
  COFFEE_SNACK: { bg: '#EFE4D8', color: '#7C4A21' },
  STAFF_TRAINING: { bg: '#E0F2FE', color: '#075985' },
  OFFICE_CLOSED: { bg: '#F3F4F6', color: '#4B5563' },
};

function eventTypeLabel(t) {
  return EVENT_TYPE_LABELS[t] || t;
}

function eventTypeChipHtml(t) {
  const c = EVENT_TYPE_COLORS[t] || { bg: 'var(--paper)', color: 'var(--slate)' };
  return `<span class="chip" style="background:${c.bg};color:${c.color};">${eventTypeLabel(t)}</span>`;
}

// Short plain-text label identifying a specific visit (e.g. "Lunch — Sep
// 15, 12:00 PM"), used to tag a message as being about that visit.
function eventMessageLabel(slot) {
  return `${eventTypeLabel(slot.eventType)} — ${fmtTime(slot.startTime)}`;
}

// Wraps an office address in a link to Google Maps (opens the Maps app on
// mobile if installed, otherwise the web) so a rep can tap straight
// through to directions instead of copying/pasting the address themselves.
function addressLinkHtml(address) {
  if (!address) return '';
  const url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(address);
  return `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:underline;text-decoration-color:var(--line);" onclick="event.stopPropagation();">${address.replace(/</g, '&lt;')}</a>`;
}

function repNameLinkHtml(rep) {
  if (!rep) return '';
  const safeName = (rep.name || '').replace(/'/g, "\\'");
  const label = rep.companyName ? `${rep.name} · ${rep.companyName}` : rep.name;
  return `<span onclick="event.stopPropagation();viewRepProfile('${rep.id}','${safeName}')" style="cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);">${label}</span>`;
}

// Shared inline "suggest a new time?" form shown after a cancel reason has
// been given, on both the office side (cancelOfficeBooking/finalizeCancelOfficeBooking)
// and the rep side (cancelRepBooking/finalizeCancelRepBooking).
function cancelSuggestFormHtml(counterpartName, finalizeFnName) {
  return `
    <div class="card" style="width:100%;margin-top:10px;padding:14px;">
      <p style="font-size:12.5px;font-weight:600;margin-bottom:8px;">Suggest a new date/time to ${counterpartName}? (optional)</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <input id="cancelSuggestDate" type="date" style="flex:1;min-width:140px;margin-bottom:8px;">
        <input id="cancelSuggestTime" type="time" style="flex:1;min-width:110px;margin-bottom:8px;">
      </div>
      <div style="display:flex;gap:8px;">
        <button type="button" style="flex:1;background:#F0F0EE;color:var(--ink);border:none;border-radius:8px;padding:8px 10px;font-size:12.5px;font-weight:600;cursor:pointer;" onclick="${finalizeFnName}(false)">Skip — cancel now</button>
        <button type="button" class="primary" style="flex:1;margin:0;" onclick="${finalizeFnName}(true)">Cancel with this suggestion</button>
      </div>
    </div>`;
}

// A concrete "suggested reschedule" outcome, shown to whichever side is
// NOT the one who needs to respond right now (the responder gets an
// actionable accept/decline form instead, rendered separately).
function rescheduleStatusHtml(booking, viewerIsOffice, counterpartLabel) {
  if (!booking || booking.status !== 'CANCELLED' || !booking.suggestedRescheduleAt) return '';
  const iSuggested = viewerIsOffice ? booking.cancelledBy === 'OFFICE' : booking.cancelledBy === 'REP';
  const timeLabel = fmtTime(booking.suggestedRescheduleAt);
  if (!booking.rescheduleResponse) {
    if (!iSuggested) return ''; // the responder's actionable form covers this case
    return `<div style="width:100%;margin-top:8px;font-size:12px;color:var(--slate);">Waiting for ${counterpartLabel} to respond to your suggested time of ${timeLabel}.</div>`;
  }
  const verb = booking.rescheduleResponse === 'ACCEPTED' ? 'accepted' : 'declined';
  const who = iSuggested ? counterpartLabel : 'You';
  const msgSuffix = booking.rescheduleResponse === 'DECLINED' && booking.rescheduleResponseMessage ? ` — "${booking.rescheduleResponseMessage}"` : '';
  return `<div style="width:100%;margin-top:8px;font-size:12px;color:var(--slate);">${who} ${verb} the suggested reschedule to ${timeLabel}${msgSuffix}</div>`;
}

// Sensible starting times per event type, used to prefill the time fields
// on both the Recurring Slots and Post an Open Slot forms so the office
// doesn't have to pick times for the common cases. A location's own saved
// recurring template (if one exists for that event type) always wins over
// these generic defaults.
const DEFAULT_EVENT_TIMES = {
  BREAKFAST: { start: '08:00', end: '09:00' },
  LUNCH: { start: '12:00', end: '13:00' },
};

// Shared lunch-order fields, used both when posting a new lunch slot and
// when an office edits an existing one's details from the ledger. `prefix`
// namespaces the element ids so more than one instance can exist at once.
function toDatetimeLocalValue(isoString) {
  const d = new Date(isoString);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function lunchDetailsFieldsHtml(prefix, values = {}, opts = {}) {
  const repHandles = !!values.repHandlesOrder;
  return `
    ${opts.includeTime ? `
    <label style="display:block;font-size:12px;font-weight:600;margin:12px 0 4px;">Start time for lunch</label>
    <input id="${prefix}StartTime" type="datetime-local" value="${values.startTime ? toDatetimeLocalValue(values.startTime) : ''}">
    <label style="display:block;font-size:12px;font-weight:600;margin:12px 0 4px;">End time for lunch</label>
    <input id="${prefix}EndTime" type="datetime-local" value="${values.endTime ? toDatetimeLocalValue(values.endTime) : ''}">
    ` : ''}
    <label style="display:block;font-size:12px;font-weight:600;margin:12px 0 4px;">Number of people</label>
    <input id="${prefix}HeadCount" type="number" min="1" value="${values.headCount ?? ''}" placeholder="e.g. 8">
    <label style="display:block;font-size:12px;font-weight:600;margin:12px 0 4px;">Allergies / dietary notes</label>
    <textarea id="${prefix}AllergyNotes" rows="2" placeholder="e.g. 2 vegetarian, 1 gluten-free" style="width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;font-size:15px;margin-bottom:12px;font-family:inherit;">${values.allergyNotes || ''}</textarea>
    <label style="display:flex;align-items:center;font-size:13px;margin-bottom:10px;">
      <input type="checkbox" id="${prefix}RepHandles" style="margin-right:8px;" ${repHandles ? 'checked' : ''} onchange="toggleLunchOrderNotes('${prefix}')">
      Let the rep place the order instead
    </label>
    <label id="${prefix}OrderNotesLabel" style="display:block;font-size:12px;font-weight:600;margin-bottom:4px;">${repHandles ? 'Notes for the rep (budget, preferences, delivery instructions, etc.)' : 'What to order'}</label>
    <textarea id="${prefix}OrderNotes" rows="3" placeholder="${repHandles ? 'e.g. Budget is $150, please include a vegetarian option, deliver by 12:15' : 'e.g. 3 turkey club sandwiches, 2 chicken caesar salads, assorted drinks'}" style="width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;font-size:15px;margin-bottom:12px;font-family:inherit;">${values.foodOrderNotes || ''}</textarea>`;
}

window.toggleLunchOrderNotes = function(prefix) {
  const checked = document.getElementById(prefix + 'RepHandles').checked;
  const label = document.getElementById(prefix + 'OrderNotesLabel');
  const textarea = document.getElementById(prefix + 'OrderNotes');
  label.textContent = checked ? 'Notes for the rep (budget, preferences, delivery instructions, etc.)' : 'What to order';
  textarea.placeholder = checked
    ? 'e.g. Budget is $150, please include a vegetarian option, deliver by 12:15'
    : 'e.g. 3 turkey club sandwiches, 2 chicken caesar salads, assorted drinks';
};

function readLunchDetailsFields(prefix) {
  const fields = {
    headCount: document.getElementById(prefix + 'HeadCount').value,
    allergyNotes: document.getElementById(prefix + 'AllergyNotes').value.trim(),
    repHandlesOrder: document.getElementById(prefix + 'RepHandles').checked,
    foodOrderNotes: document.getElementById(prefix + 'OrderNotes').value.trim(),
  };
  const startInput = document.getElementById(prefix + 'StartTime');
  const endInput = document.getElementById(prefix + 'EndTime');
  if (startInput && endInput) {
    fields.startTime = new Date(startInput.value).toISOString();
    fields.endTime = new Date(endInput.value).toISOString();
  }
  return fields;
}

window.togglePostSlotLunchFields = function() {
  const eventType = document.getElementById('eventType').value;
  const hasOrderDetails = eventType === 'LUNCH' || eventType === 'BREAKFAST';
  const label = eventType === 'LUNCH' ? 'lunch' : 'breakfast';
  document.getElementById('postSlotLunchFields').style.display = hasOrderDetails ? '' : 'none';
  document.getElementById('startTimeLabel').textContent = hasOrderDetails ? `Start time for ${label}` : 'Start time';
  document.getElementById('endTimeLabel').textContent = hasOrderDetails ? `End time for ${label}` : 'End time';
};

const SHORT_VISIT_NOTES = {
  COFFEE_SNACK: 'Coffee/Snack visits are typically 15–20 minutes.',
};

window.toggleShortVisitNote = function() {
  const note = SHORT_VISIT_NOTES[document.getElementById('eventType').value];
  const el = document.getElementById('quickVisitNote');
  el.style.display = note ? '' : 'none';
  el.textContent = note || '';
};

function dateOnly(datetimeLocalValue) {
  if (datetimeLocalValue) return datetimeLocalValue.split('T')[0];
  const d = new Date();
  d.setDate(d.getDate() + 1);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

// Prefills the start/end time fields when an event type is picked: this
// location's own saved recurring schedule for that event type if one
// exists, otherwise a sensible generic default (see DEFAULT_EVENT_TIMES).
// Keeps whatever date is already selected — only the time-of-day changes.
window.prefillPostSlotTimeForEventType = function() {
  const eventType = document.getElementById('eventType')?.value;
  const template = recurringTemplates.find(t => t.eventType === eventType);
  const times = template ? { start: template.startTime, end: template.endTime } : DEFAULT_EVENT_TIMES[eventType];
  if (!times) return;

  const startInput = document.getElementById('startTime');
  const endInput = document.getElementById('endTime');
  if (!startInput || !endInput) return;

  startInput.value = `${dateOnly(startInput.value)}T${times.start}`;
  endInput.value = `${dateOnly(endInput.value)}T${times.end}`;
};

const REPEAT_LENGTH_LABELS = { MONTHLY: '1 month', QUARTERLY: '3 months', SEMIANNUAL: '6 months', ANNUAL: '1 year' };

window.updateLunchRepeatHint = function() {
  const hint = document.getElementById('postSlotRepeatHint');
  if (!hint) return;
  const eventLabel = document.getElementById('eventType')?.value === 'BREAKFAST' ? 'breakfast' : 'lunch';
  const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY']
    .filter(d => document.getElementById('postSlotDay-' + d)?.checked);
  const repeat = document.getElementById('postSlotRepeat').value;
  if (days.length) {
    const dayLabel = days.map(d => d.slice(0, 1) + d.slice(1, 3).toLowerCase()).join('/');
    hint.textContent = repeat
      ? `Will post a ${eventLabel} every ${dayLabel} until about ${REPEAT_LENGTH_LABELS[repeat]} out, all with the same details.`
      : `Will post a ${eventLabel} on the next ${dayLabel} this week only. Pick a repeat length above to keep it going.`;
  } else {
    hint.textContent = 'Same headcount, allergy notes, and order details will be copied to each repeat, about 2 years out.';
  }
};

// Renders a read-only summary of a lunch/breakfast's order details, for
// reps looking at an open slot or their own booking. Returns '' for event
// types with no order details, or ones with nothing filled in yet.
function lunchDetailsSummaryHtml(slot) {
  if (slot.eventType !== 'LUNCH' && slot.eventType !== 'BREAKFAST') return '';
  const hasAnything = slot.headCount || slot.allergyNotes || slot.foodOrderNotes || slot.repHandlesOrder;
  if (!hasAnything) return '';
  const label = slot.eventType === 'LUNCH' ? 'Lunch' : 'Breakfast';
  return `
    <div style="background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:12px;color:var(--ink);">
      🍽 <strong>${label} order</strong>
      ${slot.headCount ? `<div>${slot.headCount} people</div>` : ''}
      ${slot.allergyNotes ? `<div>Allergies: ${slot.allergyNotes.replace(/</g, '&lt;')}</div>` : ''}
      ${slot.repHandlesOrder ? `<div style="font-weight:600;color:var(--coral);">Office asked rep to place the order</div>` : ''}
      ${slot.foodOrderNotes ? `<div>${slot.repHandlesOrder ? 'Notes for rep' : 'Order'}: ${slot.foodOrderNotes.replace(/</g, '&lt;')}</div>` : ''}
    </div>`;
}

let browseSearchDebounceTimer = null;

function filterBrowseSlots() {
  browseSearchQuery = document.getElementById('browseSearch').value;
  renderBrowseContent();

  clearTimeout(browseSearchDebounceTimer);
  const query = browseSearchQuery.trim();
  if (!query) { hideBrowseSearchSuggestions(); return; }
  browseSearchDebounceTimer = setTimeout(() => loadBrowseSearchSuggestions(query), 250);
}

async function loadBrowseSearchSuggestions(query) {
  try {
    const results = await api('/api/locations/search?q=' + encodeURIComponent(query));
    // Ignore a stale response if the rep kept typing after this request went out.
    if (document.getElementById('browseSearch')?.value.trim() !== query) return;
    showBrowseSearchSuggestions(results);
  } catch (err) {
    hideBrowseSearchSuggestions();
  }
}

function showBrowseSearchSuggestions(results) {
  const box = document.getElementById('browseSearchSuggestions');
  if (!box) return;
  if (!results.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
  box.innerHTML = results.slice(0, 6).map(r => `
    <button type="button" onmousedown="selectBrowseSearchSuggestion('${r.name.replace(/'/g, "\\'")}')" style="display:block;width:100%;text-align:left;background:none;border:none;padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line);">
      <div style="font-weight:600;">${r.name}</div>
      <div style="font-size:11px;color:var(--slate);">${r.address}${r.openSlotCount ? ` · ${r.openSlotCount} open slot${r.openSlotCount === 1 ? '' : 's'}` : ' · no open slots right now'}</div>
    </button>
  `).join('');
  box.style.display = 'block';
}

window.hideBrowseSearchSuggestions = function() {
  const box = document.getElementById('browseSearchSuggestions');
  if (box) { box.style.display = 'none'; box.innerHTML = ''; }
};

window.selectBrowseSearchSuggestion = function(name) {
  browseSearchQuery = name;
  const input = document.getElementById('browseSearch');
  if (input) input.value = name;
  hideBrowseSearchSuggestions();
  renderBrowseContent();
};

function toggleBrowseView() {
  browseViewMode = browseViewMode === 'list' ? 'calendar' : 'list';
  browseCalendarSelectedDay = null;
  document.getElementById('browseViewToggleBtn').textContent = browseViewMode === 'list' ? '📅 Calendar view' : '📋 List view';
  renderBrowseContent();
}

function renderBrowseContent() {
  const query = browseSearchQuery.trim().toLowerCase();
  let filtered = query
    ? openSlotsData.filter(s => s.location.name.toLowerCase().includes(query))
    : openSlotsData;
  // OFFICE_CLOSED entries are informational blockers, not appointment
  // types a rep would filter for, so they're always shown regardless.
  filtered = filtered.filter(s => s.eventType === 'OFFICE_CLOSED' || browseTypeFilter.has(s.eventType));

  if (browseViewMode === 'calendar') renderBrowseCalendar(filtered);
  else renderBrowseList(filtered);
}

// Shared "nothing matched" state for both list and calendar view — includes
// the office-lookup fallback (is this office on the platform at all, and if
// not, offer to notify the rep when it joins) so a search dead-end behaves
// the same regardless of which view mode the rep is in.
function renderBrowseEmptyState() {
  const content = document.getElementById('browseContent');
  const query = browseSearchQuery.trim();
  content.innerHTML = `<div class="listcard"><div class="empty">No open slots found.</div>${query ? '<div id="officeSearchFallback" style="padding:0 16px 16px;font-size:13px;color:var(--slate);">Checking if this office is on Arrowhead Access…</div>' : ''}</div>`;
  if (query) loadOfficeSearchFallback(query);
}

// A slot the rep already has a REQUESTED/CONFIRMED booking on shows its
// status instead of a Claim button — it's no longer OPEN, but the browse
// endpoint still includes it (via claimedByMe) so it doesn't just vanish
// once claimed, especially once the office approves it.
function claimButtonOrStatusHtml(s) {
  if (s.eventType === 'OFFICE_CLOSED') return '';
  if (s.claimedByMe) {
    return `<span class="chip ${s.claimedByMe}">${s.claimedByMe === 'CONFIRMED' ? '✓ Claimed' : '⏳ Requested'}</span>
      <button style="background:#F0F0EE;color:var(--ink);border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;margin-left:6px;" onclick="recallClaimedSlot('${s.booking.id}', '${s.claimedByMe}', '${(s.location.name || '').replace(/'/g, "\\'")}', '${fmtTime(s.startTime).replace(/'/g, "\\'")}')">↩️ Recall</button>`;
  }
  return `<button style="background:rgba(46,111,94,.14);color:var(--teal-dark);border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;" onclick="claimSlot('${s.id}')">Claim</button>`;
}

// Lets a rep undo a claim they made by accident right from Available Slots,
// rather than having to find it under Your bookings. A still-pending
// request is simply withdrawn (the slot reopens, nothing to notify the
// office about yet); an already-confirmed visit goes through the same
// reason-required cancel flow used elsewhere, since the office has already
// committed to it.
window.recallClaimedSlot = async function(bookingId, status, officeName, timeLabel) {
  if (status === 'CONFIRMED') {
    if (!confirm(`Are you sure you want to cancel your visit at ${officeName} on ${timeLabel}? The office will be notified by email.`)) return;
    const reason = prompt('Please provide a brief reason for the cancellation — this will be included in the email to the office:');
    if (reason === null) return;
    if (!reason.trim()) { alert('A reason is required so the office understands why.'); return; }
    try {
      await api(`/api/bookings/${bookingId}/cancel-by-rep`, { method: 'POST', body: JSON.stringify({ reason: reason.trim() }) });
      alert('Visit cancelled — the office has been notified by email.');
      loadOpenSlots();
    } catch (err) {
      alert(err.message);
    }
  } else {
    if (!confirm(`Recall your request for this visit at ${officeName} on ${timeLabel}? It'll go back to being an open slot.`)) return;
    try {
      await api(`/api/bookings/${bookingId}/withdraw`, { method: 'POST' });
      loadOpenSlots();
    } catch (err) {
      alert(err.message);
    }
  }
};

function renderBrowseList(slots) {
  if (!slots.length) { renderBrowseEmptyState(); return; }
  const content = document.getElementById('browseContent');
  content.innerHTML = `<div class="listcard">${slots.map(s => `
    <div class="row">
      <div class="time">${fmtTime(s.startTime)}</div>
      <div class="mid">
        <div class="who" style="cursor:pointer;" onclick="viewOfficeDetail('${s.location.id}')">${favoriteStarHtml(s.location.id)} ${s.location.name}</div>
        <div class="what">${addressLinkHtml(s.location.address)}</div>
        <div style="margin-top:4px;">${eventTypeChipHtml(s.eventType)}</div>
        ${ratingBadge((browseOfficeRatings[s.location.id] || {}).average, (browseOfficeRatings[s.location.id] || {}).count, 'office', s.location.id, s.location.name)}
        ${lunchDetailsSummaryHtml(s)}
      </div>
      ${claimButtonOrStatusHtml(s)}
    </div>`).join('')}</div>`;
}

async function loadOfficeSearchFallback(query) {
  const box = document.getElementById('officeSearchFallback');
  try {
    const matches = await api('/api/locations/search?q=' + encodeURIComponent(query));
    if (!document.getElementById('officeSearchFallback')) return;
    if (matches.length) {
      box.innerHTML = matches.map(m => `<div style="margin-top:8px;"><strong>${m.name.replace(/</g, '&lt;')}</strong> is on Arrowhead Access (${m.address.replace(/</g, '&lt;')}), but has no open slots posted right now.</div>`).join('');
    } else {
      box.innerHTML = `
        <div style="margin-top:8px;"><strong>${query.replace(/</g, '&lt;')}</strong> isn't on Arrowhead Access yet.</div>
        <div style="position:relative;margin-top:8px;">
          <input type="text" id="notifyMeNameInput" placeholder="Office name" autocomplete="off" value="${query.replace(/"/g, '&quot;')}" oninput="filterNotifyMeGeoSuggestions(this.value)" onblur="setTimeout(hideNotifyMeGeoSuggestions, 150)" style="margin-bottom:0;width:100%;">
          <div id="notifyMeGeoSuggestions" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:10;background:#fff;border:1px solid var(--line);border-radius:8px;margin-top:4px;box-shadow:0 4px 12px rgba(0,0,0,.08);max-height:220px;overflow-y:auto;"></div>
        </div>
        <div style="font-size:11px;color:var(--slate);margin-top:4px;">Address suggestions may take a moment to appear as you type.</div>
        <input type="text" id="notifyMeAddressInput" placeholder="Address (optional — pick a suggestion above to fill this in)" autocomplete="off" style="margin-top:6px;">
        <label style="display:flex;align-items:center;margin-top:8px;">
          <input type="checkbox" id="notifyMeCheckbox" style="margin-right:8px;">

        <div id="notifyMeStatus" style="margin-top:6px;"></div>`;
    }
  } catch (err) {

let notifyMeGeoDebounceTimer = null;

window.filterNotifyMeGeoSuggestions = function(value) {
  clearTimeout(notifyMeGeoDebounceTimer);
  const query = value.trim();
  if (query.length < 3) { window.hideNotifyMeGeoSuggestions(); return; }
  notifyMeGeoDebounceTimer = setTimeout(() => loadNotifyMeGeoSuggestions(query), 400);
};

async function loadNotifyMeGeoSuggestions(query) {
  try {
    const results = await api('/api/locations/geo-search?q=' + encodeURIComponent(query));
    // Ignore a stale response if the rep kept typing after this request went out.
    if (document.getElementById('notifyMeNameInput')?.value.trim() !== query) return;
    const box = document.getElementById('notifyMeGeoSuggestions');
    if (!box) return;
    if (!results.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
    box.innerHTML = results.map(r => `
      <button type="button" onmousedown="selectNotifyMeGeoSuggestion('${r.name.replace(/'/g, "\\'")}', '${r.address.replace(/'/g, "\\'")}')" style="display:block;width:100%;text-align:left;background:none;border:none;padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line);">
        <div style="font-weight:600;">${r.name}</div>
        <div style="font-size:11px;color:var(--slate);">${r.address}</div>
      </button>
    `).join('');
    box.style.display = 'block';
  } catch (err) {
    window.hideNotifyMeGeoSuggestions();
  }
}

window.hideNotifyMeGeoSuggestions = function() {
  const box = document.getElementById('notifyMeGeoSuggestions');
  if (box) { box.style.display = 'none'; box.innerHTML = ''; }
};

window.selectNotifyMeGeoSuggestion = function(name, address) {
  const nameInput = document.getElementById('notifyMeNameInput');
  const addressInput = document.getElementById('notifyMeAddressInput');
  if (nameInput) nameInput.value = name;
  if (addressInput) addressInput.value = address;
  window.hideNotifyMeGeoSuggestions();
};

window.submitNotifyMe = async function() {
  const checkbox = document.getElementById('notifyMeCheckbox');
  const status = document.getElementById('notifyMeStatus');
  const officeName = document.getElementById('notifyMeNameInput').value.trim();
  const address = document.getElementById('notifyMeAddressInput').value.trim();
  if (!officeName) { status.innerHTML = '<span style="color:#C23C3C;">Enter the office name first.</span>'; return; }
  if (!checkbox.checked) { status.innerHTML = '<span style="color:#C23C3C;">Check the box first.</span>'; return; }
  try {
    await api('/api/locations/notify-me', { method: 'POST', body: JSON.stringify({ officeName, address }) });
    status.innerHTML = '<span style="color:var(--teal-dark);">✓ We\'ll email you when they join.</span>';
  } catch (err) {
    status.innerHTML = `<span style="color:#C23C3C;">${err.message}</span>`;
  }
};

      <div id="calendarSyncBox"></div>

        ${['S','M','T','W','T','F','S'].map(d => `<div style="text-align:center;font-size:11px;color:var(--slate);font-family:'IBM Plex Mono',monospace;">${d}</div>`).join('')}

function attendanceListLines() {
  const rows = attendeeRows.filter(a => (a.firstName || '').trim() || (a.lastName || '').trim());
  if (!rows.length) return ['No attendees logged.'];
  return rows.map(a => {
    const name = [a.firstName, a.lastName].filter(Boolean).join(' ').trim();
    return a.npi ? `${name} (NPI: ${a.npi})` : name;
  });
}

window.copyAttendanceList = function() {
  const text = [`${attendanceLocationName} — ${attendanceDateStr}`, '', ...attendanceListLines()].join('\n');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => alert('Attendance list copied to clipboard.')).catch(() => alert(text));
  } else {
    alert(text);
  }
};

window.printAttendance = function() {
  const block = document.getElementById('attendancePrintBlock');
  if (block) {
    const rows = attendeeRows.filter(a => (a.firstName || '').trim() || (a.lastName || '').trim());
    const listHtml = rows.length
      ? `<ul style="list-style:none;padding-left:0;">${attendanceListLines().map(l => `
          <li style="display:flex;align-items:center;margin-bottom:12px;font-size:14px;">
            <span style="display:inline-block;width:16px;height:16px;border:1.5px solid #333;margin-right:10px;flex-shrink:0;"></span>
            ${l.replace(/</g, '&lt;')}
          </li>`).join('')}</ul>`
      : `<p>No attendees logged.</p>`;
    block.innerHTML = `
      <h2 style="margin-bottom:4px;">${(attendanceLocationName || '').replace(/</g, '&lt;')}</h2>
      <p style="margin-bottom:16px;">${(attendanceDateStr || '').replace(/</g, '&lt;')}</p>
      ${listHtml}`;
  }
  window.print();
};

function renderAttendeeRows() {
  const box = document.getElementById('attendeeRowsBox');

    box.innerHTML = `<p style="font-size:13px;color:var(--slate);margin-bottom:12px;">No attendees added yet.</p>`;

window.updateAttendeeField = function(index, field, value) {
  attendeeRows[index][field] = value;
};

window.addAttendeeRow = function() {
  attendeeRows.push({ firstName: '', lastName: '', npi: '' });
  renderAttendeeRows();
};

window.removeAttendeeRow = function(index) {
  attendeeRows.splice(index, 1);
  renderAttendeeRows();
};

window.openAttendance = function(bookingId, locationName, dateStr) {
  attendanceBookingId = bookingId;
  attendanceLocationName = locationName;
  attendanceDateStr = dateStr;
  setState({ screen: 'attendance' });
};

async function loadAttendees() {
  try {
    const attendees = await api(`/api/bookings/${attendanceBookingId}/attendees`);
    attendeeRows = attendees.map(a => ({ firstName: a.firstName, lastName: a.lastName, npi: a.npi || '' }));
  } catch (err) {
    attendeeRows = [];
  }
  renderAttendeeRows();
}

async function saveAttendees() {
  const cleaned = attendeeRows.filter(a => a.firstName.trim() && a.lastName.trim());
  try {
    await api(`/api/bookings/${attendanceBookingId}/attendees`, { method: 'POST', body: JSON.stringify({ attendees: cleaned }) });
    setState({ screen: 'dashboard' });
  } catch (err) {
    setState({ formErr: err.message });
  }
}

function parseEmployeeCsv(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ',') {
      row.push(field); field = '';
    } else if (c === '\n') {
      row.push(field); rows.push(row); row = []; field = '';
    } else if (c === '\r') {
      // skip, \n (or end of file) closes the row
    } else {
      field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => f.trim() !== ''));
}

window.downloadEmployeeCsvTemplate = function() {
  const csv = 'Name,Title,NPI\nJane Smith,MD,1234567890\nJohn Doe,Nurse,\n';

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'arrowhead-team-template.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

window.handleEmployeeCsvUpload = function(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const msgBox = document.getElementById('employeeUploadMsg');
  const reader = new FileReader();
  reader.onload = function() {
    event.target.value = '';
    const rows = parseEmployeeCsv(String(reader.result || ''));
    if (!rows.length) {
      if (msgBox) msgBox.innerHTML = `<div class="msg err">That file appears to be empty.</div>`;
      return;
    }

    let startIdx = 0, nameIdx = 0, titleIdx = -1, npiIdx = -1;
    const header = rows[0].map(h => h.trim().toLowerCase());
    if (header.some(h => h.includes('name'))) {
      nameIdx = header.findIndex(h => h.includes('name'));
      titleIdx = header.findIndex(h => h.includes('title') || h.includes('role') || h.includes('position'));
      npiIdx = header.findIndex(h => h.includes('npi'));
      startIdx = 1;
    }

    let added = 0;
    for (let i = startIdx; i < rows.length; i++) {
      const r = rows[i];
      const name = (r[nameIdx] || '').trim();
      if (!name) continue;
      const rawTitle = titleIdx >= 0 ? (r[titleIdx] || '').trim() : '';
      const npi = npiIdx >= 0 ? (r[npiIdx] || '').trim() : '';
      const matchedTitle = EMPLOYEE_TITLE_OPTIONS.find(t => t.toLowerCase() === rawTitle.toLowerCase());
      employeeRows.push({
        name,
        title: matchedTitle || rawTitle,
        npi,
        customTitle: !!rawTitle && !matchedTitle,
      });
      added++;
    }

    renderEmployeeRows();
    if (msgBox) {
      msgBox.innerHTML = added
        ? `<div class="msg ok">Added ${added} team member${added === 1 ? '' : 's'} from your file. Review the list below, then click "Save team list".</div>`
        : `<div class="msg err">No names were found in that file. Make sure it has a "Name" column (or a name in the first column of each row).</div>`;
    }
  };
  reader.onerror = function() {
    if (msgBox) msgBox.innerHTML = `<div class="msg err">Could not read that file. Please try again.</div>`;
  };
  reader.readAsText(file);
};

async function fetchRatingAverages(ids, kind) {
  const unique = [...new Set(ids)].filter(Boolean);
  const entries = await Promise.all(unique.map(async id => {
    try {
      const res = await api(`/api/reviews/${kind}-average/${id}`);
      return [id, res];
    } catch (err) {
      return [id, { average: null, count: 0 }];
    }
  }));
  return Object.fromEntries(entries);
}

window.openConversation = function(id, counterpart, targetId) {
  activeConversationId = id;
  activeConversationCounterpart = counterpart;
  activeConversationTargetId = targetId;
  activeConversationEventLabel = null;

};

// `eventLabel`, when given, is set from a "Message" button on a specific
// visit's row rather than the general Messages list — every message sent
// while it's showing gets tagged with it, so a rep/office scrolling the
// shared history later can tell which visit a given message was about.
window.startConversation = async function(targetId, counterpart, eventLabel) {
  activeConversationId = null;
  activeConversationCounterpart = counterpart;
  activeConversationTargetId = targetId;
  activeConversationEventLabel = eventLabel || null;
  conversationMessages = [];
  setState({ screen: 'conversation' });

  // A conversation with this counterpart may already exist (e.g. reached via
  // a "Message" button on a booking row rather than the messages list) — look
  // it up so existing history loads instead of showing an empty "say hello".
  try {
    const conversations = await api('/api/messages/conversations');
    const existing = conversations.find(c => (state.role === 'rep' ? c.location.id : c.rep.id) === targetId);
    if (existing) {
      activeConversationId = existing.id;
      await loadConversationMessages();
    }
  } catch (err) {}
};

window.insertMaterialLink = function(title, url) {
  const input = document.getElementById('newMessageBody');
  if (!input) return;
  // #newMessageBody is a single-line text input, so a literal newline
  // wouldn't actually display as a break — space-separated reads fine
  // as one line and the URL still comes through clickable once sent.
  const snippet = `📎 ${title}: ${url}`;
  input.value = input.value.trim() ? `${input.value.trim()} ${snippet}` : snippet;

  }
}

// Escapes the message text first, then turns any http(s) URL into a real
// clickable link — needed now that a rep can drop a saved-material link
// straight into a message body.
function linkifyMessageBody(body) {
  const escaped = body.replace(/</g, '&lt;');
  return escaped.replace(/(https?:\/\/[^\s]+)/g, url =>
    `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color:var(--teal-dark);text-decoration:underline;">${url}</a>`
  );
}

function renderMessages() {
  const box = document.getElementById('messagesBox');
  if (!conversationMessages.length) { box.innerHTML = '<div class="empty">No messages yet — say hello!</div>'; return; }
  const myType = state.role === 'rep' ? 'REP' : 'OFFICE';
  let lastLabel = null;
  box.innerHTML = conversationMessages.map(m => {
    // Only repeat the "Re: ..." tag when it changes from the message right
    // before it, so a back-and-forth about the same visit isn't relabeled
    // on every single line.
    const showLabel = m.eventLabel && m.eventLabel !== lastLabel;
    lastLabel = m.eventLabel || null;
    return `
    <div style="padding:10px 14px;border-bottom:1px solid var(--line);${m.senderType === myType ? 'background:#F7FBF9;' : ''}">
      ${showLabel ? `<div style="font-size:11px;font-weight:600;color:var(--teal-dark);margin-bottom:4px;">Re: ${m.eventLabel.replace(/</g, '&lt;')}</div>` : ''}
      <div style="font-size:13px;">${linkifyMessageBody(m.body)}</div>
      <div style="font-size:10px;color:var(--slate);margin-top:4px;">${fmtTime(m.createdAt)}</div>
    </div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

window.sendMessage = async function() {
  const input = document.getElementById('newMessageBody');
  const body = input.value.trim();
  if (!body) return;

  const payload = { body };
  if (state.role === 'rep') payload.locationId = activeConversationTargetId;
  else payload.repId = activeConversationTargetId;
  if (activeConversationEventLabel) payload.eventLabel = activeConversationEventLabel;

  try {
    const message = await api('/api/messages', { method: 'POST', body: JSON.stringify(payload) });
    activeConversationId = message.conversationId;
    input.value = '';
    await loadConversationMessages();
  } catch (err) {
    if (!handleSubscriptionRequired(err)) alert(err.message);
  }
};

function attachmentFilename(url) {
  return decodeURIComponent(url.split('/').pop().replace(/^\d+-/, ''));
}

function renderFileCard(url) {
  return `<a href="${url}" target="_blank" rel="noopener" style="flex:0 0 auto;width:140px;height:110px;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:8px;font-size:12px;">
    <span style="font-size:24px;">📄</span>

  </a>`;
}

window.handleThumbError = function(img) {
  const anchor = img.closest('a');
  if (anchor) anchor.outerHTML = renderFileCard(img.getAttribute('data-fallback-url'));
};

// Files picked from a phone/tablet photo library sometimes come through
// with no extension on the filename at all, so a URL-extension check alone
// can't reliably tell images apart from documents. Instead this always
// tries loading the URL as an image first, and only falls back to the
// generic file-card look if that actually fails to load.
function renderAttachmentThumb(url) {
  const knownNonImage = /\.(pdf|docx?|xlsx?|pptx?|csv|txt)(\?.*)?$/i.test(url);
  if (knownNonImage) return renderFileCard(url);
  return `<a href="${url}" target="_blank" rel="noopener" style="flex:0 0 auto;">
    <img src="${url}" alt="Attachment" data-fallback-url="${url}" style="width:140px;height:110px;border-radius:8px;border:1px solid var(--line);display:block;object-fit:cover;" onerror="handleThumbError(this)">
  </a>`;
}

// Renders every file attached to a literature item as a horizontally
// scrollable strip, so an office can flip through a multi-file brochure
// or a set of case studies without leaving the list.
function renderLiteratureAttachments(item) {

  if (!urls.length) return '';
  return `<div style="display:flex;gap:8px;overflow-x:auto;margin-top:8px;padding-bottom:4px;">${urls.map(renderAttachmentThumb).join('')}</div>`;
}

async function uploadLiteratureFile(file) {
  const token = localStorage.getItem('token');
  const formData = new FormData();
  formData.append('file', file);
  const res = await fetch(API_BASE + '/api/literature/upload', {
    method: 'POST',
    headers: token ? { 'Authorization': `Bearer ${token}` } : {},
    body: formData,
  });
  if (!res.ok) {
    const error = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(error.error || error.message || 'Upload failed');
  }
  return res.json();
}

window.handleMaterialFileChange = async function(event) {

  event.target.value = '';
  if (!files.length) return;

  const statusEl = document.getElementById('materialUploadStatus');
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    statusEl.textContent = `Uploading ${i + 1} of ${files.length}…`;
    try {
      const { url } = await uploadLiteratureFile(file);
      const title = file.name.replace(/\.[^.]+$/, '');
      await api('/api/profile/materials', { method: 'POST', body: JSON.stringify({ title, url }) });
    } catch (err) {
      statusEl.textContent = '';
      alert(err.message);
      return;
    }
  }
  statusEl.textContent = `${files.length} file(s) added`;
  loadMaterials();
};

      </label>`).join('')}` : '<div class="empty" style="padding:8px;">No saved materials yet — add some under Profile → Marketing Materials.</div>';
  } catch (err) {
    box.innerHTML = `<div class="msg err">${err.message}</div>`;
  }
}

// Shared by both the individual checkboxes and "Select all" — true if the
// material was actually added (false if the attachment cap stopped it).
function addSavedMaterial(url, title) {
  if (pendingLiteratureAttachments.length >= MAX_LITERATURE_ATTACHMENTS) return false;
  pendingLiteratureAttachments.push({ url, name: title });
  return true;
}

function removeSavedMaterial(url) {
  const idx = pendingLiteratureAttachments.findIndex(a => a.url === url);
  if (idx !== -1) pendingLiteratureAttachments.splice(idx, 1);
}

// Keeps the "Select all" checkbox's own checked state in sync with
// whether every individual saved-material checkbox is currently checked.
function syncSavedMaterialsSelectAll() {
  const selectAll = document.getElementById('savedMaterialsSelectAll');
  const boxes = document.querySelectorAll('.savedMaterialCb');
  if (selectAll && boxes.length) selectAll.checked = [...boxes].every(cb => cb.checked);
}

window.toggleSavedMaterial = function(checkbox) {
  const { url, title } = checkbox.dataset;
  if (checkbox.checked) {
    if (!addSavedMaterial(url, title)) {
      checkbox.checked = false;
      alert(`You can attach up to ${MAX_LITERATURE_ATTACHMENTS} files.`);
      return;
    }
  } else {
    removeSavedMaterial(url);
  }
  syncSavedMaterialsSelectAll();
  renderPendingLiteratureAttachments();
};

window.toggleSavedMaterialsSelectAll = function(checked) {
  const boxes = document.querySelectorAll('.savedMaterialCb');
  if (checked) {
    let hitCap = false;
    boxes.forEach(cb => {
      if (cb.checked) return;
      if (addSavedMaterial(cb.dataset.url, cb.dataset.title)) {
        cb.checked = true;
      } else {
        hitCap = true;
      }
    });
    if (hitCap) alert(`You can attach up to ${MAX_LITERATURE_ATTACHMENTS} files — not all saved materials fit.`);
  } else {
    boxes.forEach(cb => {
      removeSavedMaterial(cb.dataset.url);
      cb.checked = false;
    });
  }
  syncSavedMaterialsSelectAll();
  renderPendingLiteratureAttachments();
};

window.removePendingLiteratureAttachment = function(index) {
  const [removed] = pendingLiteratureAttachments.splice(index, 1);
  renderPendingLiteratureAttachments();
  // If this attachment came from the saved-materials picker, uncheck it there too.
  if (removed) {
    const picker = document.getElementById('savedMaterialsPicker');
    picker?.querySelectorAll('.savedMaterialCb').forEach(cb => {
      if (cb.dataset.url === removed.url) cb.checked = false;
    });
    syncSavedMaterialsSelectAll();
  }
};

window.handleLiteratureFileChange = async function(event) {
  const files = Array.from(event.target.files || []);
  event.target.value = '';
  if (!files.length) return;

  const statusEl = document.getElementById('literatureUploadStatus');
  const room = MAX_LITERATURE_ATTACHMENTS - pendingLiteratureAttachments.length;
  if (room <= 0) {
    statusEl.textContent = `You can attach up to ${MAX_LITERATURE_ATTACHMENTS} files.`;
    return;
  }
  const toUpload = files.slice(0, room);
  if (files.length > toUpload.length) {
    statusEl.textContent = `Only attaching ${toUpload.length} — max ${MAX_LITERATURE_ATTACHMENTS} files per submission.`;
  }

  for (let i = 0; i < toUpload.length; i++) {
    const file = toUpload[i];
    statusEl.textContent = `Uploading ${i + 1} of ${toUpload.length}…`;
    try {
      const result = await uploadLiteratureFile(file);
      pendingLiteratureAttachments.push({ url: result.url, name: file.name });
      renderPendingLiteratureAttachments();
    } catch (err) {
      statusEl.textContent = '';
      alert(err.message);
      return;
    }
  }
  statusEl.textContent = pendingLiteratureAttachments.length ? `${pendingLiteratureAttachments.length} file(s) attached` : '';
};

  setState({ formErr: null });

  loadLiterature();

window.submitLiterature = async function() {
  const locationId = document.getElementById('literatureLocationSelect').value;
  const title = document.getElementById('literatureTitle').value.trim();
  const linkUrl = document.getElementById('literatureLink').value.trim();
  const description = document.getElementById('literatureDescription').value.trim();

  if (!locationId || !title) {
    setState({ formErr: 'Office and title are required' });
    return;
  }

  const attachmentUrls = pendingLiteratureAttachments.map(a => a.url);
  const payload = { locationId, title, description, linkUrl, attachmentUrls };

  try {
    await api('/api/literature', { method: 'POST', body: JSON.stringify(payload) });
    onLiteratureSent();
  } catch (err) {
    if (err.status === 409 && err.code === 'DUPLICATE') {
      if (confirm(err.message)) {
        try {
          await api('/api/literature', { method: 'POST', body: JSON.stringify({ ...payload, force: true }) });
          onLiteratureSent();
        } catch (err2) {
          setState({ formErr: err2.message });
        }
      }
      return;
    }
    if (handleSubscriptionRequired(err)) return;
    setState({ formErr: err.message });
  }
};

// ========== LOAD DATA ==========
// Set while a rep is on the "enter your code" step of email 2FA — kept
// outside `state` (rather than as setState fields) so a stray re-render
// elsewhere in the app can't accidentally drop them back to the
// email/password form mid-verification.
let repOtpPending = false;
let repOtpRepId = null;
let repOtpEmail = '';

async function doLogin() {
  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const endpoint = state.role === 'office' ? '/api/auth/staff/login' : '/api/auth/rep/login';
  const trustedDeviceToken = state.role === 'office' ? null : localStorage.getItem('repTrustedDevice:' + email);

  try {
    const res = await api(endpoint, { method: 'POST', body: JSON.stringify({ email, password, trustedDeviceToken }) });
    if (res.requiresOtp) {
      repOtpPending = true;
      repOtpRepId = res.repId;
      repOtpEmail = email;
      setState({ formErr: null });
      return;
    }
    localStorage.setItem('token', res.token);
    state.me = state.role === 'office' ? res.staff : res.rep;
    setState({ screen: 'dashboard', role: state.role });
  } catch (err) {
    setState({ formErr: err.message });
  }
}

window.cancelRepOtp = function() {
  repOtpPending = false;
  repOtpRepId = null;
  repOtpEmail = '';
  setState({ formErr: null });
};

window.doVerifyRepOtp = async function() {
  const code = document.getElementById('otpCode').value.trim();
  const rememberDevice = document.getElementById('rememberDevice').checked;

  try {
    const res = await api('/api/auth/rep/verify-otp', {
      method: 'POST',
      body: JSON.stringify({ repId: repOtpRepId, code, rememberDevice }),
    });
    if (res.trustedDeviceToken) {
      localStorage.setItem('repTrustedDevice:' + repOtpEmail, res.trustedDeviceToken);
    }
    localStorage.setItem('token', res.token);
    state.me = res.rep;
    repOtpPending = false;
    repOtpRepId = null;
    repOtpEmail = '';
    setState({ screen: 'dashboard', role: 'rep' });
  } catch (err) {
    setState({ formErr: err.message });
  }
};

async function doResetPassword() {
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (newPassword !== confirmPassword) {
    setState({ formErr: "Passwords don't match" });
    return;
  }
  if (!newPassword || newPassword.length < 6) {
    setState({ formErr: 'Password must be at least 6 characters' });
    return;
  }

  try {
    await api('/api/auth/reset-password', { method: 'POST', body: JSON.stringify({ token: state.resetToken, newPassword }) });
    state.resetToken = null;
    window.history.replaceState({}, '', window.location.pathname);
    setState({ screen: 'role', formErr: null });
    alert('Password updated! You can now log in with your new password.');
  } catch (err) {
    setState({ formErr: err.message });
  }
}

    return;

  if (!newPassword || newPassword.length < 6) {
    setState({ formErr: 'New password must be at least 6 characters', passwordChanged: false });
    return;
  }

  try {
    await api('/api/auth/change-password', { method: 'POST', body: JSON.stringify({ currentPassword, newPassword }) });
    setState({ formErr: null, passwordChanged: true });
  } catch (err) {
    setState({ formErr: err.message, passwordChanged: false });
  }
}

// Renders the Cloudflare Turnstile widget into the signup form's placeholder
// div. The script tag loads async, so this polls briefly until it's ready
// rather than assuming it's already on window by the time the screen renders.
function renderTurnstile() {
  turnstileToken = null;
  const container = document.getElementById('turnstileBox');
  if (!container) return;
  const tryRender = () => {
    if (!document.getElementById('turnstileBox')) return; // navigated away
    if (!window.turnstile) { setTimeout(tryRender, 150); return; }
    turnstile.render('#turnstileBox', {
      sitekey: TURNSTILE_SITE_KEY,
      callback: (token) => { turnstileToken = token; },
    });
  };
  tryRender();
}

      favoriteLocationIds.add(locationId);
    }
    // Flip every star button for this office wherever it appears on the
    // current screen, without re-fetching or re-rendering the whole thing.
    const nowFav = favoriteLocationIds.has(locationId);
    document.querySelectorAll(`[data-fav-location="${locationId}"]`).forEach(btn => {
      btn.textContent = nowFav ? '★' : '☆';
      btn.style.color = nowFav ? '#D9A441' : 'var(--slate)';
      btn.title = nowFav ? 'Remove from favorites' : 'Add to favorites';
    });
    // The profile page's list is filtered to favorites only, so a removal
    // there needs the row gone, not just the star flipped.
    if (state.screen === 'profile' && !nowFav) loadFavoriteOffices();
  } catch (err) {
    alert(err.message);
  }
};

function handleProfileImageChange(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const MAX = 300;
      let width = img.width, height = img.height;
      if (width > height && width > MAX) { height = Math.round(height * (MAX / width)); width = MAX; }
      else if (height > MAX) { width = Math.round(width * (MAX / height)); height = MAX; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      selectedProfileImage = canvas.toDataURL('image/jpeg', 0.8);
      showProfileImagePreview(selectedProfileImage);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

window.addProductToCompany = async function(companyId) {
  const input = document.getElementById('newProductName');

  const name = input.value.trim();
  if (!name) {
    errBox.innerHTML = `<div class="msg err">Product name is required</div>`;
    return;
  }

  const checkedIds = new Set(Array.from(document.querySelectorAll('.product-checkbox:checked')).map(e => e.value));

  try {
    const product = await api(`/api/profile/catalog/company/${companyId}/product`, { method: 'POST', body: JSON.stringify({ name }) });
    const company = catalogData.find(c => c.id === companyId);
    if (company && !company.products.some(p => p.id === product.id)) {
      company.products.push(product);
      company.products.sort((a, b) => a.name.localeCompare(b.name));
    }
    checkedIds.add(product.id);
    renderProductsBox(company, checkedIds);
  } catch (err) {

};

// Posts the slot. Pass silent=true (from saveAllPostSlot) to suppress this
// function's own success alert/navigation and get a true/false result back
// instead, so the caller can report on both this and Visit Policies together.
async function submitPostSlot(silent) {
  const startTime = document.getElementById('startTime').value;
  const endTime = document.getElementById('endTime').value;
  const eventType = document.getElementById('eventType').value;
  const btn = document.getElementById('postSlotBtn');

  if (!startTime || !endTime) {
    setState({ formErr: 'Both start and end times are required' });
    return false;
  }

  const payload = { startTime: new Date(startTime).toISOString(), endTime: new Date(endTime).toISOString(), eventType };
  if (eventType === 'LUNCH' || eventType === 'BREAKFAST') {
    Object.assign(payload, readLunchDetailsFields('postSlot'));
    const repeat = document.getElementById('postSlotRepeat').value;
    if (repeat) payload.repeatInterval = repeat;
    const daysOfWeek = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY']
      .filter(d => document.getElementById('postSlotDay-' + d).checked);
    if (daysOfWeek.length) payload.daysOfWeek = daysOfWeek;
  }

  if (!silent) { btn.disabled = true; btn.textContent = 'Posting…'; }
  try {
    const res = await api('/api/slots', { method: 'POST', body: JSON.stringify(payload) });
    if (!silent) {
      alert(res.created > 1 ? `${res.created} slots posted!` : 'Slot posted!');
      setState({ screen: 'dashboard' });
    }
    return true;
  } catch (err) {
    if (silent) return false;
    setState({ formErr: err.message });
    return false;
  }
}

// Posts the slot and saves Visit Policies together with one button.
window.saveAllPostSlot = async function() {
  const btn = document.getElementById('saveAllPostSlotBtn');
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = 'Saving…';

  try {
    const [slotOk, policyOk] = await Promise.all([
      submitPostSlot(true),
      saveOfficePolicy(true),
    ]);

    if (slotOk && policyOk) {
      alert('Slot posted and policy saved!');
      setState({ screen: 'dashboard' });
    } else {
      const failed = [!slotOk && 'the slot', !policyOk && 'Visit Policies'].filter(Boolean).join(' and ');
      setState({ formErr: `Could not save: ${failed}. Please try again.` });
    }
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
};

// Kept so the "🆕 Pending requests" toggle can re-render its expanded

let pendingRequestsSlots = [];
let pendingRequestsExpanded = false;

// dashboard, so an office doesn't have to scroll the full ledger to find
// and act on a pending rep request. Collapsed to a single subtle line by
// default — a busy office with a lot of requests coming in shouldn't get
// a wall of cards every time they land on the dashboard — and expands to
// the full list on click. Reuses the ledger's own data (no extra API
// call) and hides itself entirely when there's nothing pending.
function renderPendingRequestsBox(slots) {
  const box = document.getElementById('pendingRequestsBox');
  if (!box) return;
  pendingRequestsSlots = slots;
  const pending = slots.filter(s => s.status === 'REQUESTED' && s.booking?.rep);
  if (!pending.length) { box.innerHTML = ''; pendingRequestsExpanded = false; return; }

  box.innerHTML = `
    <button type="button" onclick="togglePendingRequestsExpanded()" style="display:flex;align-items:center;gap:6px;width:100%;background:#FFF8F0;border:1px solid #F0D9B5;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;margin-bottom:${pendingRequestsExpanded ? '8px' : '16px'};">
      🆕 ${pending.length} pending request${pending.length === 1 ? '' : 's'}
      <span style="margin-left:auto;color:var(--slate);font-weight:400;">${pendingRequestsExpanded ? 'Hide ▲' : 'Review ▼'}</span>
    </button>
    ${pendingRequestsExpanded ? `
      <div style="margin-bottom:16px;">
        ${pending.map(s => `
          <div class="row" style="flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;">

// Filters visit-history rows by whether any of their visible text matches
// the query, so it works the same way for a rep searching by office name
// and an office searching by rep name without needing separate logic.
window.filterHistorySearch = function(query) {
  const box = document.getElementById('historyBox');
  const noMatches = document.getElementById('historyNoMatches');
  if (!box) return;
  const q = query.trim().toLowerCase();
  const rows = box.querySelectorAll(':scope > .row');
  let visibleCount = 0;
  rows.forEach(row => {
    const match = !q || row.textContent.toLowerCase().includes(q);
    row.style.display = match ? '' : 'none';
    if (match) visibleCount++;
  });
  if (noMatches) noMatches.style.display = (rows.length && q && !visibleCount) ? '' : 'none';
};

window.openOfficeCalendar = function() {
  officeCalendarMonth = new Date();
  officeCalendarSelectedDay = null;
  officeCancelDraft = null;
  setState({ screen: 'officeCalendar' });
  loadOfficeCalendarBookings();
};

// Same reasoning as loadCalendarBookings above — kept out of the render()
// dispatch table to avoid a fetch/render/fetch loop.
async function loadOfficeCalendarBookings() {
  try {
    // scope=all — the calendar's month-back navigation needs full history,
    // unlike the dashboard ledger which defaults to today onward.
    officeCalendarSlots = await api('/api/bookings/locations/' + state.me.locationId + '/ledger?scope=all');
    render();
  } catch (err) {}
}

window.changeOfficeCalendarMonth = function(delta) {
  officeCalendarMonth = new Date(officeCalendarMonth.getFullYear(), officeCalendarMonth.getMonth() + delta, 1);
  officeCalendarSelectedDay = null;
  officeCancelDraft = null;
  render();
};

window.selectOfficeCalendarDay = function(day) {
  officeCalendarSelectedDay = day;
  officeCancelDraft = null;
  render();
};

// Searches this office's already-loaded calendar data (officeCalendarSlots,
// fetched once with scope=all) for upcoming lunches/breakfasts matching the
// typed rep name — no separate API call needed since it's all in memory.
window.filterOfficeCalendarSearch = function(query) {
  const box = document.getElementById('officeCalendarSearchResults');
  if (!box) return;
  const q = query.trim().toLowerCase();
  if (q.length < 2) { box.style.display = 'none'; box.innerHTML = ''; return; }

  const now = new Date();
  const matches = officeCalendarSlots
    .filter(s => s.booking && ['REQUESTED', 'CONFIRMED'].includes(s.booking.status))
    .filter(s => s.eventType === 'LUNCH' || s.eventType === 'BREAKFAST')
    .filter(s => new Date(s.startTime) >= now)
    .filter(s => (s.booking.rep.name || '').toLowerCase().includes(q))
    .sort((a, b) => new Date(a.startTime) - new Date(b.startTime))
    .slice(0, 8);

  if (!matches.length) {
    box.innerHTML = `<div style="padding:10px 12px;font-size:13px;color:var(--slate);">No upcoming lunches or breakfasts match "${query.replace(/</g, '&lt;')}".</div>`;
    box.style.display = 'block';
    return;
  }

  box.innerHTML = matches.map(s => `
    <button type="button" onmousedown="jumpToOfficeCalendarDay('${s.startTime}')" style="display:block;width:100%;text-align:left;background:none;border:none;padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line);">
      <div style="font-weight:600;">${fmtTime(s.startTime)}</div>
      <div style="font-size:11px;color:var(--slate);">${(s.booking.rep.name || '').replace(/</g, '&lt;')} · ${eventTypeLabel(s.eventType)}</div>
    </button>
  `).join('');
  box.style.display = 'block';
};

window.hideOfficeCalendarSearchResults = function() {
  const box = document.getElementById('officeCalendarSearchResults');
  if (box) { box.style.display = 'none'; box.innerHTML = ''; }
};

// Jumps the calendar to whatever month/day a search result falls on and
// opens that day, same as if the office had tapped it directly.
window.jumpToOfficeCalendarDay = function(startTimeIso) {
  const d = new Date(startTimeIso);
  officeCalendarMonth = new Date(d.getFullYear(), d.getMonth(), 1);
  officeCalendarSelectedDay = d.getDate();
  officeCancelDraft = null;
  const search = document.getElementById('officeCalendarSearch');
  if (search) search.value = '';
  hideOfficeCalendarSearchResults();
  render();
};

window.toggleLedgerSelectAll = function(checked) {
  const openIds = ledgerSlotsData.filter(s => s.status === 'OPEN').map(s => s.id);
  selectedLedgerSlotIds = new Set(checked ? openIds : []);

// Keeps the "Remove selected" button's label/enabled state and the
// "Select all" checkbox's own checked state in sync after any change.
function updateLedgerBulkBar() {
  const btn = document.getElementById('removeSelectedLedgerBtn');
  if (btn) {
    btn.disabled = selectedLedgerSlotIds.size === 0;
    btn.textContent = selectedLedgerSlotIds.size ? `🗑 Remove selected (${selectedLedgerSlotIds.size})` : '🗑 Remove selected';
  }
  const openCount = ledgerSlotsData.filter(s => s.status === 'OPEN').length;
  const selectAll = document.getElementById('ledgerSelectAllCb');
  if (selectAll) selectAll.checked = openCount > 0 && selectedLedgerSlotIds.size === openCount;
}

window.cancelOfficeBooking = async function(bookingId, repName, timeLabel) {
  if (!confirm(`Are you sure you want to cancel the visit with ${repName} at ${timeLabel}? The rep will be notified by email.`)) return;
  const reason = prompt('Please provide a brief reason for the cancellation — this will be included in the email to the rep:');
  if (reason === null) return;
  if (!reason.trim()) {
    alert('A reason is required so the rep understands why the visit was cancelled.');
    return;
  }
  officeCancelDraft = { bookingId, repName, timeLabel, reason: reason.trim() };
  render();
};

window.finalizeCancelOfficeBooking = async function(withSuggestion) {
  if (!officeCancelDraft) return;
  const { bookingId, reason } = officeCancelDraft;

  let suggestedTime = null;
  if (withSuggestion) {
    const dateVal = document.getElementById('cancelSuggestDate')?.value;
    const timeVal = document.getElementById('cancelSuggestTime')?.value;
    if (dateVal && timeVal) {
      const parsed = new Date(`${dateVal}T${timeVal}`);
      if (!isNaN(parsed.getTime())) suggestedTime = parsed.toISOString();
    }
    if (!suggestedTime) {
      alert('Enter both a date and a time to send a suggestion, or use "Skip — cancel now" instead.');
      return;
    }
  }

  try {
    await api(`/api/bookings/${bookingId}/cancel`, { method: 'POST', body: JSON.stringify({ reason, suggestedTime }) });
    alert('Visit cancelled — the rep has been notified by email' + (suggestedTime ? ', including your suggested new time.' : '.'));
    officeCancelDraft = null;
    if (state.screen === 'officeCalendar') loadOfficeCalendarBookings();
    else loadOfficeLedger();
  } catch (err) {
    alert(err.message);
  }
};

async function loadTransfers() {

  const outgoingBox = document.getElementById('outgoingBox');
  try {
    const incoming = await api('/api/transfers/incoming');
    incomingBox.innerHTML = incoming.length ? incoming.map(t => `
      <div class="row">
        <div class="time">${fmtTime(t.booking.slot.startTime)}</div>
        <div class="mid">
          <div class="who">${t.booking.slot.location.name}</div>
          <div class="what">from ${t.fromRep.name} · ${t.fromRep.companyName}</div>
        </div>
        <button style="background:#E8F5E9;color:#2D6F5E;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;" onclick="decideTransfer('${t.id}','accept')">✓ Accept</button>
        <button style="background:#FDEAEA;color:#C23C3C;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;" onclick="decideTransfer('${t.id}','decline')">✕ Decline</button>

  } catch (err) {
    incomingBox.innerHTML = `<div class="msg err" style="margin:14px;">${err.message}</div>`;
  }

  try {
    const outgoing = await api('/api/transfers/outgoing');
    outgoingBox.innerHTML = outgoing.length ? outgoing.map(t => `
      <div class="row">
        <div class="time">${fmtTime(t.booking.slot.startTime)}</div>
        <div class="mid">
          <div class="who">${t.booking.slot.location.name}</div>
          <div class="what">${t.toRep ? `to ${t.toRep.name} · ${t.toRep.companyName}` : `to ${t.toRepEmail} — not signed up yet, invited by email`}</div>
        </div>
        <span class="chip ${t.status}">${t.status}</span>
      </div>`).join('') : '<div class="empty">No outgoing transfers.</div>';
  } catch (err) {
    outgoingBox.innerHTML = `<div class="msg err" style="margin:14px;">${err.message}</div>`;
  }
}

window.respondToReschedule = async function(bookingId, decision) {
  const messageBox = document.getElementById(`rescheduleMsg-${bookingId}`);
  const message = (messageBox?.value || '').trim();
  if (decision === 'decline' && !message) {
    alert('Please add a quick message so the office knows why — required when declining.');
    return;
  }
  if (decision === 'accept' && !confirm('Accept this new time? It will be confirmed on the calendar right away.')) return;
  try {
    await api(`/api/bookings/${bookingId}/reschedule/respond`, { method: 'POST', body: JSON.stringify({ decision, message }) });
    alert(decision === 'accept' ? 'Reschedule accepted — the new visit is confirmed.' : 'Your response was sent to the office.');
    loadMyBookings();
  } catch (err) {
    alert(err.message);
  }
};

// ========== RENDER ==========
function render() {
  const app = document.getElementById('app');
  const logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) logoutBtn.style.display = state.screen === 'role' ? 'none' : 'block';
  document.body.classList.toggle('medical-bg', ['role', 'login', 'forgotPassword', 'resetPassword', 'terms', 'privacy'].includes(state.screen));
  if (!['dashboard', 'officeCalendar'].includes(state.screen)) officeCancelDraft = null;
  if (state.screen !== 'dashboard') repCancelDraft = null;

  if (state.screen === 'role') app.innerHTML = screenRole();
  else if (state.screen === 'terms') app.innerHTML = screenTerms();
  else if (state.screen === 'privacy') app.innerHTML = screenPrivacy();
  else if (state.screen === 'login') app.innerHTML = screenLogin();
  else if (state.screen === 'forgotPassword') app.innerHTML = screenForgotPassword();
  else if (state.screen === 'resetPassword') app.innerHTML = screenResetPassword();
  else if (state.screen === 'signup') { app.innerHTML = screenSignup(); renderTurnstile(); }
  else if (state.screen === 'profile') { app.innerHTML = screenProfile(); initProfileScreen(); }
  else if (state.screen === 'officeSettings') { app.innerHTML = screenOfficeSettings(); loadEmployees(); loadLocationsSettings(); }
  else if (state.screen === 'officeStaff') { app.innerHTML = screenOfficeStaff(); }
  else if (state.screen === 'officeDetail') { app.innerHTML = screenOfficeDetail(); }
  else if (state.screen === 'repProfileView') { app.innerHTML = screenRepProfileView(); }
  else if (state.screen === 'reviewVisit') { app.innerHTML = screenReviewVisit(); renderStarRating(); }
  else if (state.screen === 'accountSettings') { app.innerHTML = screenAccountSettings(); if (state.role === 'rep') loadTwoFactorSetting(); }
  else if (state.screen === 'postSlot') {
    app.innerHTML = screenPostSlot();
    // The event type <select> defaults to its first option (Lunch) on
    // load, but the order-details section's visibility is only wired to
    // the select's onchange — which never fires just from the page
    // rendering with that default already selected. Run the same
    // toggle/prefill logic once immediately so the form matches whatever
    // is actually selected from the start, not just after the office
    // staff picks a different type and switches back.
    togglePostSlotLunchFields();
    toggleShortVisitNote();
    updateLunchRepeatHint();
    loadOfficePolicy();
    loadRecurringTemplates().then(prefillPostSlotTimeForEventType);
  }
  else if (state.screen === 'browseSlots') { app.innerHTML = screenBrowseSlots(); loadOpenSlots(); }
  else if (state.screen === 'transfers') { app.innerHTML = screenTransfers(); loadTransfers(); }
  else if (state.screen === 'messages') { app.innerHTML = screenMessages(); loadConversations(); }
  else if (state.screen === 'conversation') { app.innerHTML = screenConversation(); loadConversationMessages(); }
  else if (state.screen === 'literature') { app.innerHTML = screenLiterature(); loadLiterature(); }
  else if (state.screen === 'materials') { app.innerHTML = screenMaterials(); loadMaterials(); }
  else if (state.screen === 'attendance') { app.innerHTML = screenAttendance(); loadAttendees(); }
  else if (state.screen === 'reviewList') { app.innerHTML = screenReviewList(); loadReviewList(); }
  else if (state.screen === 'calendar') { app.innerHTML = screenCalendar(); }
  else if (state.screen === 'officeCalendar') { app.innerHTML = screenOfficeCalendar(); }
  else if (state.screen === 'dashboard' && state.role === 'office') { app.innerHTML = screenDashboardOffice(); loadOfficeLedger(); loadLocationSwitcher(); }
  else if (state.screen === 'dashboard' && state.role === 'rep') { app.innerHTML = screenDashboardRep(); loadMyBookings(); loadBillingStatus(); }
  else if (state.screen === 'visitHistory' && state.role === 'office') { app.innerHTML = screenVisitHistory(); loadOfficeHistory(); }
  else if (state.screen === 'visitHistory' && state.role === 'rep') { app.innerHTML = screenVisitHistory(); loadRepHistory(); }

  const billingParam = new URLSearchParams(window.location.search).get('billing');
  const billingSessionId = new URLSearchParams(window.location.search).get('session_id');
  if (billingParam === 'success' || billingParam === 'cancelled') {
    // Strip the query params immediately so the next render() (any click,
    // any navigation) doesn't see them again and re-fire the alert.
    const url = new URL(window.location.href);
    url.searchParams.delete('billing');
    url.searchParams.delete('session_id');
    window.history.replaceState({}, '', url);

    // Belt-and-suspenders against a reopened/reloaded tab or bookmark that
    // still points at an old checkout's success URL: remember which Stripe
    // checkout sessions we've already shown the alert for (keyed by Stripe's
    // own session_id, so it survives across tabs and reloads, not just
    // in-app navigation) and never show it twice for the same one.
    let acked = [];
    try { acked = JSON.parse(localStorage.getItem('ackedBillingSessions') || '[]'); } catch (e) {}
    const alreadyShown = billingSessionId && acked.includes(billingSessionId);
    if (billingSessionId && !alreadyShown) {
      acked.push(billingSessionId);
      localStorage.setItem('ackedBillingSessions', JSON.stringify(acked.slice(-20)));
    }

    if (alreadyShown) {
      // Skip both alerts below — already acknowledged this exact checkout.
    } else if (billingParam === 'success') {
      setTimeout(async () => {
        try {
          const status = await api('/api/billing/founding-status');
          alert(status.subscriptionStatus === 'TRIALING'
            ? 'Subscription started! Your 14-day free trial has begun.'
            : 'Subscription started! Your card has been charged and your plan is now active.');
        } catch (err) {
          alert('Subscription started!');
        }
      }, 300);
    }
    else setTimeout(() => alert('Checkout cancelled — no charge was made.'), 300);
  }
}

// Init
const resetTokenParam = new URLSearchParams(window.location.search).get('resetToken');
const transferParam = new URLSearchParams(window.location.search).get('transfer');
const transferEmailParam = new URLSearchParams(window.location.search).get('email');
const openSlotsParam = new URLSearchParams(window.location.search).get('openSlots');
if (resetTokenParam) {
  state.resetToken = resetTokenParam;
  state.screen = 'resetPassword';
  render();
} else if (localStorage.getItem('token')) {
  api('/api/auth/me').then(async me => {
    if (me.role === 'rep') {
      state.me = await api('/api/profile/rep');
      state.role = 'rep';
    } else {
      state.me = { id: me.sub, role: me.role === 'office_admin' ? 'ADMIN' : 'STAFF', locationId: me.locationId };
      state.role = 'office';
    }
    state.screen = (me.role === 'rep' && openSlotsParam === '1') ? 'browseSlots' : 'dashboard';
    render();
  }).catch(() => {
    localStorage.removeItem('token');
    render();
  });
} else if (transferParam === '1' && transferEmailParam) {
  pendingTransferEmail = transferEmailParam;
  state.screen = 'signup';
  state.role = 'rep';
  render();
} else {
  render();
}
</script>
