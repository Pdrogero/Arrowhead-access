// ========== UTILITY ==========
async function api(path, options = {}) {
  const token = localStorage.getItem('token');
  const headers = {
    'Content-Type': 'application/json',
    ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
  };

  const res = await fetch(API_BASE + path, {
    ...options,
    headers: { ...headers, ...options.headers },
  });

  if (!res.ok) {
    const error = await res.json().catch(() => ({ error: res.statusText }));
    const err = new Error(error.error || error.message || 'API error');
    err.status = res.status;
    err.code = error.code;
    throw err;
  }

  return res.json();
}

function setState(updates) { Object.assign(state, updates); render(); }
function logout() { localStorage.removeItem('token'); setState({ screen: 'role', role: null, me: null }); }
function goHome() {
  if (localStorage.getItem('token') && state.me) {
    setState({ screen: 'dashboard' });
  } else {
    setState({ screen: 'role', role: null, me: null });
  }
}

const EVENT_TYPE_LABELS = {
  REP_VISIT: 'Rep visit',
  LUNCH: 'Lunch',
  BREAKFAST: 'Breakfast',
  QUICK_VISIT: 'Quick visit (15–20 min)',
  STAFF_TRAINING: 'Staff training',
  OFFICE_CLOSED: 'Office closed',
};

// Distinct colors per event type so it's scannable at a glance, separate
// from the green/amber/red palette already used for booking/transfer status.
const EVENT_TYPE_COLORS = {
  REP_VISIT: { bg: '#DFE7FF', color: '#1F3A8A' },
  LUNCH: { bg: '#FDECE7', color: '#C2410C' },
  BREAKFAST: { bg: '#FEF9C3', color: '#854D0E' },
  QUICK_VISIT: { bg: '#F3E8FF', color: '#6B21A8' },
  STAFF_TRAINING: { bg: '#E0F2FE', color: '#075985' },
  OFFICE_CLOSED: { bg: '#F3F4F6', color: '#4B5563' },
};

function eventTypeLabel(t) {
  return EVENT_TYPE_LABELS[t] || t;
}

function eventTypeChipHtml(t) {
  const c = EVENT_TYPE_COLORS[t] || { bg: 'var(--paper)', color: 'var(--slate)' };
  return `<span class="chip" style="background:${c.bg};color:${c.color};">${eventTypeLabel(t)}</span>`;
}

// Wraps an office address in a link to Google Maps (opens the Maps app on
// mobile if installed, otherwise the web) so a rep can tap straight
// through to directions instead of copying/pasting the address themselves.
function addressLinkHtml(address) {
  if (!address) return '';
  const url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(address);
  return `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:underline;text-decoration-color:var(--line);" onclick="event.stopPropagation();">${address.replace(/</g, '&lt;')}</a>`;
}

// Sensible starting times per event type, used to prefill the time fields
// on both the Recurring Slots and Post an Open Slot forms so the office
// doesn't have to pick times for the common cases. A location's own saved
// recurring template (if one exists for that event type) always wins over
// these generic defaults.
const DEFAULT_EVENT_TIMES = {
  BREAKFAST: { start: '08:00', end: '09:00' },
  LUNCH: { start: '12:00', end: '13:00' },
};

// Shared lunch-order fields, used both when posting a new lunch slot and
// when an office edits an existing one's details from the ledger. `prefix`
// namespaces the element ids so more than one instance can exist at once.
function toDatetimeLocalValue(isoString) {
  const d = new Date(isoString);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function lunchDetailsFieldsHtml(prefix, values = {}, opts = {}) {
  const repHandles = !!values.repHandlesOrder;
  return `
    ${opts.includeTime ? `
    <label style="display:block;font-size:12px;font-weight:600;margin:12px 0 4px;">Start time for lunch</label>
    <input id="${prefix}StartTime" type="datetime-local" value="${values.startTime ? toDatetimeLocalValue(values.startTime) : ''}">
    <label style="display:block;font-size:12px;font-weight:600;margin:12px 0 4px;">End time for lunch</label>
    <input id="${prefix}EndTime" type="datetime-local" value="${values.endTime ? toDatetimeLocalValue(values.endTime) : ''}">
    ` : ''}
    <label style="display:block;font-size:12px;font-weight:600;margin:12px 0 4px;">Number of people</label>
    <input id="${prefix}HeadCount" type="number" min="1" value="${values.headCount ?? ''}" placeholder="e.g. 8">
    <label style="display:block;font-size:12px;font-weight:600;margin:12px 0 4px;">Allergies / dietary notes</label>
    <textarea id="${prefix}AllergyNotes" rows="2" placeholder="e.g. 2 vegetarian, 1 gluten-free" style="width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;font-size:15px;margin-bottom:12px;font-family:inherit;">${values.allergyNotes || ''}</textarea>
    <label style="display:flex;align-items:center;font-size:13px;margin-bottom:10px;">
      <input type="checkbox" id="${prefix}RepHandles" style="margin-right:8px;" ${repHandles ? 'checked' : ''} onchange="toggleLunchOrderNotes('${prefix}')">
      Let the rep place the order instead
    </label>
    <label id="${prefix}OrderNotesLabel" style="display:block;font-size:12px;font-weight:600;margin-bottom:4px;">${repHandles ? 'Notes for the rep (budget, preferences, delivery instructions, etc.)' : 'What to order'}</label>
    <textarea id="${prefix}OrderNotes" rows="3" placeholder="${repHandles ? 'e.g. Budget is $150, please include a vegetarian option, deliver by 12:15' : 'e.g. 3 turkey club sandwiches, 2 chicken caesar salads, assorted drinks'}" style="width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;font-size:15px;margin-bottom:12px;font-family:inherit;">${values.foodOrderNotes || ''}</textarea>`;
}

window.toggleLunchOrderNotes = function(prefix) {
  const checked = document.getElementById(prefix + 'RepHandles').checked;
  const label = document.getElementById(prefix + 'OrderNotesLabel');
  const textarea = document.getElementById(prefix + 'OrderNotes');
  label.textContent = checked ? 'Notes for the rep (budget, preferences, delivery instructions, etc.)' : 'What to order';
  textarea.placeholder = checked
    ? 'e.g. Budget is $150, please include a vegetarian option, deliver by 12:15'
    : 'e.g. 3 turkey club sandwiches, 2 chicken caesar salads, assorted drinks';
};

function readLunchDetailsFields(prefix) {
  const fields = {
    headCount: document.getElementById(prefix + 'HeadCount').value,
    allergyNotes: document.getElementById(prefix + 'AllergyNotes').value.trim(),
    repHandlesOrder: document.getElementById(prefix + 'RepHandles').checked,
    foodOrderNotes: document.getElementById(prefix + 'OrderNotes').value.trim(),
  };
  const startInput = document.getElementById(prefix + 'StartTime');
  const endInput = document.getElementById(prefix + 'EndTime');
  if (startInput && endInput) {
    fields.startTime = new Date(startInput.value).toISOString();
    fields.endTime = new Date(endInput.value).toISOString();
  }
  return fields;
}

window.togglePostSlotLunchFields = function() {
  const isLunch = document.getElementById('eventType').value === 'LUNCH';

function dateOnly(datetimeLocalValue) {
  if (datetimeLocalValue) return datetimeLocalValue.split('T')[0];
  const d = new Date();
  d.setDate(d.getDate() + 1);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

// Prefills the start/end time fields when an event type is picked: this
// location's own saved recurring schedule for that event type if one
// exists, otherwise a sensible generic default (see DEFAULT_EVENT_TIMES).
// Keeps whatever date is already selected — only the time-of-day changes.
window.prefillPostSlotTimeForEventType = function() {
  const eventType = document.getElementById('eventType')?.value;
  const template = recurringTemplates.find(t => t.eventType === eventType);
  const times = template ? { start: template.startTime, end: template.endTime } : DEFAULT_EVENT_TIMES[eventType];
  if (!times) return;

  const startInput = document.getElementById('startTime');
  const endInput = document.getElementById('endTime');
  if (!startInput || !endInput) return;

  startInput.value = `${dateOnly(startInput.value)}T${times.start}`;
  endInput.value = `${dateOnly(endInput.value)}T${times.end}`;
};

const REPEAT_LENGTH_LABELS = { MONTHLY: '1 month', QUARTERLY: '3 months', SEMIANNUAL: '6 months', ANNUAL: '1 year' };

window.updateLunchRepeatHint = function() {
  const hint = document.getElementById('postSlotRepeatHint');
  if (!hint) return;
  const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY']
    .filter(d => document.getElementById('postSlotDay-' + d)?.checked);
  const repeat = document.getElementById('postSlotRepeat').value;
  if (days.length) {
    const dayLabel = days.map(d => d.slice(0, 1) + d.slice(1, 3).toLowerCase()).join('/');
    hint.textContent = repeat
      ? `Will post a lunch every ${dayLabel} until about ${REPEAT_LENGTH_LABELS[repeat]} out, all with the same details.`
      : `Will post a lunch on the next ${dayLabel} this week only. Pick a repeat length above to keep it going.`;
  } else {
    hint.textContent = 'Same headcount, allergy notes, and order details will be copied to each repeat, about 2 years out.';
  }
};

// Renders a read-only summary of a lunch's order details, for reps looking
// at an open slot or their own booking. Returns '' for non-lunch slots or
// lunches with nothing filled in yet.
function lunchDetailsSummaryHtml(slot) {
  if (slot.eventType !== 'LUNCH') return '';
  const hasAnything = slot.headCount || slot.allergyNotes || slot.foodOrderNotes || slot.repHandlesOrder;
  if (!hasAnything) return '';
  return `
    <div style="background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:12px;color:var(--ink);">
      🍽 <strong>Lunch order</strong>
      ${slot.headCount ? `<div>${slot.headCount} people</div>` : ''}
      ${slot.allergyNotes ? `<div>Allergies: ${slot.allergyNotes.replace(/</g, '&lt;')}</div>` : ''}
      ${slot.repHandlesOrder ? `<div style="font-weight:600;color:var(--coral);">Office asked rep to place the order</div>` : ''}
      ${slot.foodOrderNotes ? `<div>${slot.repHandlesOrder ? 'Notes for rep' : 'Order'}: ${slot.foodOrderNotes.replace(/</g, '&lt;')}</div>` : ''}
    </div>`;
}

async function loadOfficeSearchFallback(query) {
  const box = document.getElementById('officeSearchFallback');
  try {
    const matches = await api('/api/locations/search?q=' + encodeURIComponent(query));
    if (!document.getElementById('officeSearchFallback')) return;
    if (matches.length) {
      box.innerHTML = matches.map(m => `<div style="margin-top:8px;"><strong>${m.name.replace(/</g, '&lt;')}</strong> is on Arrowhead Access (${m.address.replace(/</g, '&lt;')}), but has no open slots posted right now.</div>`).join('');
    } else {
      box.innerHTML = `
        <div style="margin-top:8px;"><strong>${query.replace(/</g, '&lt;')}</strong> isn't on Arrowhead Access yet.</div>
        <label style="display:flex;align-items:center;margin-top:8px;">
          <input type="checkbox" id="notifyMeCheckbox" style="margin-right:8px;">
          Notify me when they join
        </label>
        <button class="primary" style="margin-top:8px;width:auto;padding:8px 16px;" onclick="submitNotifyMe('${query.replace(/'/g, "\\'")}')">Save</button>
        <div id="notifyMeStatus" style="margin-top:6px;"></div>`;
    }
  } catch (err) {
    if (box) box.innerHTML = '';
  }
}

window.submitNotifyMe = async function(officeName) {
  const checkbox = document.getElementById('notifyMeCheckbox');
  const status = document.getElementById('notifyMeStatus');
  if (!checkbox.checked) { status.innerHTML = '<span style="color:#C23C3C;">Check the box first.</span>'; return; }
  try {
    await api('/api/locations/notify-me', { method: 'POST', body: JSON.stringify({ officeName }) });
    status.innerHTML = '<span style="color:var(--teal-dark);">✓ We\'ll email you when they join.</span>';
  } catch (err) {
    status.innerHTML = `<span style="color:#C23C3C;">${err.message}</span>`;
  }
};

function renderBrowseCalendar(slots) {
  const content = document.getElementById('browseContent');
  const year = browseCalendarMonth.getFullYear();
  const month = browseCalendarMonth.getMonth();
  const monthLabel = browseCalendarMonth.toLocaleString(undefined, { month: 'long', year: 'numeric' });
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const slotsByDay = {};
  slots.forEach(s => {
    const d = new Date(s.startTime);
    if (d.getFullYear() === year && d.getMonth() === month) {
      const day = d.getDate();
      (slotsByDay[day] = slotsByDay[day] || []).push(s);
    }
  });

  let cells = '';
  for (let i = 0; i < firstDay; i++) cells += `<div></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const has = slotsByDay[day];
    cells += `<button onclick="selectBrowseCalendarDay(${day})" style="aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:${has ? 'rgba(46,111,94,.12)' : '#fff'};font-size:13px;position:relative;cursor:pointer;">
      ${day}${has ? `<div style="position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--teal);"></div>` : ''}
    </button>`;
  }

  const daySlots = browseCalendarSelectedDay ? (slotsByDay[browseCalendarSelectedDay] || []) : [];

  content.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
      <button class="link" style="width:auto;margin:0;font-size:26px;font-weight:800;line-height:1;" onclick="changeBrowseCalendarMonth(-1)">‹</button>
      <div style="font-family:'Instrument Serif',serif;font-size:20px;">${monthLabel}</div>
      <button class="link" style="width:auto;margin:0;font-size:26px;font-weight:800;line-height:1;" onclick="changeBrowseCalendarMonth(1)">›</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:20px;">
      ${['S','M','T','W','T','F','S'].map(d => `<div style="text-align:center;font-size:11px;color:var(--slate);font-family:'IBM Plex Mono',monospace;">${d}</div>`).join('')}
      ${cells}
    </div>
    ${browseCalendarSelectedDay ? `
      <p style="font-size:13px;font-weight:600;margin-bottom:8px;">${monthLabel.split(' ')[0]} ${browseCalendarSelectedDay}</p>
      <div class="listcard">
        ${daySlots.length ? daySlots.map(s => `
          <div class="row">
            <div class="time">${fmtTime(s.startTime)}</div>
            <div class="mid">
              <div class="who">${s.location.name}</div>
              <div>${eventTypeChipHtml(s.eventType)}</div>
              ${ratingBadge((browseOfficeRatings[s.location.id] || {}).average, (browseOfficeRatings[s.location.id] || {}).count)}
            </div>
            <button style="background:rgba(46,111,94,.14);color:var(--teal-dark);border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;" onclick="claimSlot('${s.id}')">Claim</button>
          </div>`).join('') : '<div class="empty">No open slots this day.</div>'}
      </div>` : ''}
  `;
}

window.changeBrowseCalendarMonth = function(delta) {
  browseCalendarMonth = new Date(browseCalendarMonth.getFullYear(), browseCalendarMonth.getMonth() + delta, 1);
  browseCalendarSelectedDay = null;
  renderBrowseContent();
};

window.selectBrowseCalendarDay = function(day) {

  const bookingsByDay = {};

function attendanceListLines() {
  const rows = attendeeRows.filter(a => (a.firstName || '').trim() || (a.lastName || '').trim());
  if (!rows.length) return ['No attendees logged.'];
  return rows.map(a => {
    const name = [a.firstName, a.lastName].filter(Boolean).join(' ').trim();
    return a.npi ? `${name} (NPI: ${a.npi})` : name;
  });
}

window.copyAttendanceList = function() {
  const text = [`${attendanceLocationName} — ${attendanceDateStr}`, '', ...attendanceListLines()].join('\n');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => alert('Attendance list copied to clipboard.')).catch(() => alert(text));
  } else {
    alert(text);
  }
};

window.printAttendance = function() {
  const block = document.getElementById('attendancePrintBlock');
  if (block) {
    const rows = attendeeRows.filter(a => (a.firstName || '').trim() || (a.lastName || '').trim());
    const listHtml = rows.length
      ? `<ul style="list-style:none;padding-left:0;">${attendanceListLines().map(l => `
          <li style="display:flex;align-items:center;margin-bottom:12px;font-size:14px;">
            <span style="display:inline-block;width:16px;height:16px;border:1.5px solid #333;margin-right:10px;flex-shrink:0;"></span>
            ${l.replace(/</g, '&lt;')}

      : `<p>No attendees logged.</p>`;
    block.innerHTML = `
      <h2 style="margin-bottom:4px;">${(attendanceLocationName || '').replace(/</g, '&lt;')}</h2>
      <p style="margin-bottom:16px;">${(attendanceDateStr || '').replace(/</g, '&lt;')}</p>

const EMPLOYEE_TITLE_OPTIONS = ['MD', 'DO', 'DPM', 'ARNP', 'PA', 'Nurse', 'LPN', 'Medical Assistant', 'Staff', 'Front Desk', 'Medical Student'];
const NPI_ELIGIBLE_TITLES = ['MD', 'DO', 'DPM', 'ARNP', 'PA', 'Medical Student'];

function renderEmployeeRows() {
  const box = document.getElementById('employeeRowsBox');
  if (!employeeRows.length) {
    box.innerHTML = `<p style="font-size:13px;color:var(--slate);margin-bottom:12px;">No team members added yet.</p>`;
    return;
  }
  box.innerHTML = employeeRows.map((e, i) => {

    return `
    <div style="margin-bottom:10px;padding-bottom:10px;${i < employeeRows.length - 1 ? 'border-bottom:1px solid var(--line);' : ''}">
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:${e.customTitle || showNpi ? '6px' : '0'};">

        <select onchange="updateEmployeeTitleField(${i}, this.value)" style="margin-bottom:0;flex:1;">
          <option value="">Title…</option>
          ${EMPLOYEE_TITLE_OPTIONS.map(t => `<option value="${t}" ${e.title === t ? 'selected' : ''}>${t}</option>`).join('')}
          <option value="__OTHER__" ${e.customTitle ? 'selected' : ''}>Other…</option>
        </select>
        <button type="button" onclick="removeEmployeeRow(${i})" title="Remove" style="background:none;border:none;color:#C23C3C;font-size:16px;cursor:pointer;padding:4px 8px;">✕</button>
      </div>
      ${e.customTitle ? `<input type="text" placeholder="Enter title" value="${e.title || ''}" oninput="updateEmployeeCustomTitle(${i}, this.value)" style="margin-bottom:${showNpi ? '6px' : '0'};">` : ''}
      ${showNpi ? `<input type="text" placeholder="NPI number (optional)" value="${e.npi || ''}" oninput="updateEmployeeNpiField(${i}, this.value)" style="margin-bottom:0;">` : ''}
    </div>`;
  }).join('');
}

window.updateEmployeeField = function(index, value) {
  employeeRows[index].name = value;
};

window.updateEmployeeTitleField = function(index, value) {
  if (value === '__OTHER__') {
    employeeRows[index].customTitle = true;
    employeeRows[index].title = '';
  } else {
    employeeRows[index].customTitle = false;
    employeeRows[index].title = value;
  }
  renderEmployeeRows();
};

window.updateEmployeeCustomTitle = function(index, value) {
  employeeRows[index].title = value;
};

window.updateEmployeeNpiField = function(index, value) {
  employeeRows[index].npi = value;
};

window.addEmployeeRow = function() {
  employeeRows.push({ name: '', title: '', npi: '', customTitle: false });
  renderEmployeeRows();
};

window.removeEmployeeRow = function(index) {
  employeeRows.splice(index, 1);
  renderEmployeeRows();
};

async function fetchRatingAverages(ids, kind) {
  const unique = [...new Set(ids)].filter(Boolean);
  const entries = await Promise.all(unique.map(async id => {
    try {
      const res = await api(`/api/reviews/${kind}-average/${id}`);
      return [id, res];
    } catch (err) {
      return [id, { average: null, count: 0 }];
    }
  }));
  return Object.fromEntries(entries);
}

window.startConversation = async function(targetId, counterpart) {
  activeConversationId = null;

  conversationMessages = [];
  setState({ screen: 'conversation' });

  // A conversation with this counterpart may already exist (e.g. reached via
  // a "Message" button on a booking row rather than the messages list) — look
  // it up so existing history loads instead of showing an empty "say hello".
  try {

async function loadConversationMessages() {
  if (!activeConversationId) { renderMessages(); return; }
  const box = document.getElementById('messagesBox');
  try {

    renderMessages();

    box.innerHTML = `<div class="msg err" style="margin:14px;">${err.message}</div>`;
  }

function renderMessages() {
  const box = document.getElementById('messagesBox');
  if (!conversationMessages.length) { box.innerHTML = '<div class="empty">No messages yet — say hello!</div>'; return; }
  const myType = state.role === 'rep' ? 'REP' : 'OFFICE';
  box.innerHTML = conversationMessages.map(m => `
    <div style="padding:10px 14px;border-bottom:1px solid var(--line);${m.senderType === myType ? 'background:#F7FBF9;' : ''}">
      <div style="font-size:13px;">${m.body.replace(/</g, '&lt;')}</div>
      <div style="font-size:10px;color:var(--slate);margin-top:4px;">${fmtTime(m.createdAt)}</div>

window.sendMessage = async function() {
  const input = document.getElementById('newMessageBody');
  const body = input.value.trim();
  if (!body) return;

  const payload = { body };
  if (state.role === 'rep') payload.locationId = activeConversationTargetId;
  else payload.repId = activeConversationTargetId;

  try {
    const message = await api('/api/messages', { method: 'POST', body: JSON.stringify(payload) });
    activeConversationId = message.conversationId;
    input.value = '';
    await loadConversationMessages();
  } catch (err) {
    if (!handleSubscriptionRequired(err)) alert(err.message);
  }
};

function attachmentFilename(url) {
  return decodeURIComponent(url.split('/').pop().replace(/^\d+-/, ''));
}

function renderFileCard(url) {
  return `<a href="${url}" target="_blank" rel="noopener" style="flex:0 0 auto;width:140px;height:110px;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:8px;font-size:12px;">
    <span style="font-size:24px;">📄</span>
    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;">${attachmentFilename(url)}</span>
  </a>`;
}

window.handleThumbError = function(img) {
  const anchor = img.closest('a');
  if (anchor) anchor.outerHTML = renderFileCard(img.getAttribute('data-fallback-url'));
};

// Files picked from a phone/tablet photo library sometimes come through
// with no extension on the filename at all, so a URL-extension check alone
// can't reliably tell images apart from documents. Instead this always
// tries loading the URL as an image first, and only falls back to the
// generic file-card look if that actually fails to load.
function renderAttachmentThumb(url) {
  const knownNonImage = /\.(pdf|docx?|xlsx?|pptx?|csv|txt)(\?.*)?$/i.test(url);
  if (knownNonImage) return renderFileCard(url);
  return `<a href="${url}" target="_blank" rel="noopener" style="flex:0 0 auto;">
    <img src="${url}" alt="Attachment" data-fallback-url="${url}" style="width:140px;height:110px;border-radius:8px;border:1px solid var(--line);display:block;object-fit:cover;" onerror="handleThumbError(this)">
  </a>`;
}

// Renders every file attached to a literature item as a horizontally
// scrollable strip, so an office can flip through a multi-file brochure
// or a set of case studies without leaving the list.
function renderLiteratureAttachments(item) {
  const urls = [...(item.attachments || []).map(a => a.url), ...(item.linkUrl ? [item.linkUrl] : [])];
  if (!urls.length) return '';
  return `<div style="display:flex;gap:8px;overflow-x:auto;margin-top:8px;padding-bottom:4px;">${urls.map(renderAttachmentThumb).join('')}</div>`;
}

async function uploadLiteratureFile(file) {
  const token = localStorage.getItem('token');
  const formData = new FormData();
  formData.append('file', file);
  const res = await fetch(API_BASE + '/api/literature/upload', {
    method: 'POST',
    headers: token ? { 'Authorization': `Bearer ${token}` } : {},
    body: formData,
  });
  if (!res.ok) {
    const error = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(error.error || error.message || 'Upload failed');
  }
  return res.json();
}

window.handleMaterialFileChange = async function(event) {
  const files = Array.from(event.target.files || []);
  event.target.value = '';
  if (!files.length) return;

  const statusEl = document.getElementById('materialUploadStatus');
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    statusEl.textContent = `Uploading ${i + 1} of ${files.length}…`;
    try {
      const { url } = await uploadLiteratureFile(file);
      const title = file.name.replace(/\.[^.]+$/, '');
      await api('/api/profile/materials', { method: 'POST', body: JSON.stringify({ title, url }) });
    } catch (err) {
      statusEl.textContent = '';
      alert(err.message);
      return;
    }
  }
  statusEl.textContent = `${files.length} file(s) added`;
  loadMaterials();
};

window.toggleSavedMaterial = function(checkbox, url, title) {
  if (checkbox.checked) {
    if (pendingLiteratureAttachments.length >= MAX_LITERATURE_ATTACHMENTS) {
      checkbox.checked = false;
      alert(`You can attach up to ${MAX_LITERATURE_ATTACHMENTS} files.`);
      return;
    }
    pendingLiteratureAttachments.push({ url, name: title });
  } else {
    const idx = pendingLiteratureAttachments.findIndex(a => a.url === url);
    if (idx !== -1) pendingLiteratureAttachments.splice(idx, 1);
  }
  renderPendingLiteratureAttachments();
};

window.removePendingLiteratureAttachment = function(index) {
  const [removed] = pendingLiteratureAttachments.splice(index, 1);
  renderPendingLiteratureAttachments();
  // If this attachment came from the saved-materials picker, uncheck it there too.
  if (removed) {
    const picker = document.getElementById('savedMaterialsPicker');
    picker?.querySelectorAll('input[type=checkbox]').forEach(cb => {
      if (cb.getAttribute('onchange')?.includes(`'${removed.url}'`)) cb.checked = false;
    });
  }
};

window.handleLiteratureFileChange = async function(event) {
  const files = Array.from(event.target.files || []);
  event.target.value = '';
  if (!files.length) return;

  const statusEl = document.getElementById('literatureUploadStatus');
  const room = MAX_LITERATURE_ATTACHMENTS - pendingLiteratureAttachments.length;
  if (room <= 0) {
    statusEl.textContent = `You can attach up to ${MAX_LITERATURE_ATTACHMENTS} files.`;
    return;
  }
  const toUpload = files.slice(0, room);
  if (files.length > toUpload.length) {
    statusEl.textContent = `Only attaching ${toUpload.length} — max ${MAX_LITERATURE_ATTACHMENTS} files per submission.`;
  }

  for (let i = 0; i < toUpload.length; i++) {
    const file = toUpload[i];
    statusEl.textContent = `Uploading ${i + 1} of ${toUpload.length}…`;
    try {
      const result = await uploadLiteratureFile(file);
      pendingLiteratureAttachments.push({ url: result.url, name: file.name });
      renderPendingLiteratureAttachments();
    } catch (err) {
      statusEl.textContent = '';
      alert(err.message);
      return;
    }
  }
  statusEl.textContent = pendingLiteratureAttachments.length ? `${pendingLiteratureAttachments.length} file(s) attached` : '';
};

window.submitLiterature = async function() {
  const locationId = document.getElementById('literatureLocationSelect').value;
  const title = document.getElementById('literatureTitle').value.trim();
  const linkUrl = document.getElementById('literatureLink').value.trim();
  const description = document.getElementById('literatureDescription').value.trim();

  if (!locationId || !title) {
    setState({ formErr: 'Office and title are required' });
    return;
  }

  const attachmentUrls = pendingLiteratureAttachments.map(a => a.url);
  const payload = { locationId, title, description, linkUrl, attachmentUrls };

  try {
    await api('/api/literature', { method: 'POST', body: JSON.stringify(payload) });
    onLiteratureSent();
  } catch (err) {
    if (err.status === 409 && err.code === 'DUPLICATE') {
      if (confirm(err.message)) {
        try {
          await api('/api/literature', { method: 'POST', body: JSON.stringify({ ...payload, force: true }) });
          onLiteratureSent();
        } catch (err2) {
          setState({ formErr: err2.message });
        }
      }
      return;
    }
    if (handleSubscriptionRequired(err)) return;
    setState({ formErr: err.message });
  }
};

async function doResetPassword() {

  const confirmPassword = document.getElementById('confirmPassword').value;

    setState({ formErr: "Passwords don't match" });
    return;

    setState({ formErr: 'Password must be at least 6 characters' });
    return;

  try {
    await api('/api/auth/reset-password', { method: 'POST', body: JSON.stringify({ token: state.resetToken, newPassword }) });

    window.history.replaceState({}, '', window.location.pathname);

    alert('Password updated! You can now log in with your new password.');
  } catch (err) {

// Renders the Cloudflare Turnstile widget into the signup form's placeholder

function renderTurnstile() {
  turnstileToken = null;
  const container = document.getElementById('turnstileBox');
  if (!container) return;
  const tryRender = () => {
    if (!document.getElementById('turnstileBox')) return; // navigated away

    turnstile.render('#turnstileBox', {

  };
  tryRender();
}

function handleProfileImageChange(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const MAX = 300;
      let width = img.width, height = img.height;
      if (width > height && width > MAX) { height = Math.round(height * (MAX / width)); width = MAX; }
      else if (height > MAX) { width = Math.round(width * (MAX / height)); height = MAX; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      selectedProfileImage = canvas.toDataURL('image/jpeg', 0.8);
      showProfileImagePreview(selectedProfileImage);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

  try {
    const product = await api(`/api/profile/catalog/company/${companyId}/product`, { method: 'POST', body: JSON.stringify({ name }) });
    const company = catalogData.find(c => c.id === companyId);
    if (company && !company.products.some(p => p.id === product.id)) {

// Finds the most recently created recurring template matching whichever
// event type is currently selected, and checks the matching days/times so
// the office can see (and keep seeing after logging back in) what's
// already scheduled instead of the form always looking blank.
window.prefillRecurringFieldsForEventType = function() {
  const eventType = document.getElementById('recurringEventType')?.value;
  const note = document.getElementById('recurringCurrentScheduleNote');
  const lunchNote = document.getElementById('recurringLunchNote');
  const days = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
  const template = recurringTemplates.find(t => t.eventType === eventType);
  const defaults = DEFAULT_EVENT_TIMES[eventType] || { start: '09:00', end: '17:00' };

  days.forEach(day => {
    const cb = document.getElementById('day-' + day);
    if (cb) cb.checked = !!template?.daysOfWeek.includes(day);
  });

  if (document.getElementById('recurringStart')) document.getElementById('recurringStart').value = template?.startTime || defaults.start;
  if (document.getElementById('recurringEnd')) document.getElementById('recurringEnd').value = template?.endTime || defaults.end;

  if (lunchNote) lunchNote.style.display = eventType === 'LUNCH' ? '' : 'none';

  if (note) {
    note.textContent = template
      ? `Currently scheduled: ${template.daysOfWeek.map(d => d.slice(0, 3)).join(', ')}, ${template.startTime}–${template.endTime}`
      : '';
  }
};

async function submitPostSlot() {
  const startTime = document.getElementById('startTime').value;
  const endTime = document.getElementById('endTime').value;
  const eventType = document.getElementById('eventType').value;
  const btn = document.getElementById('postSlotBtn');

  if (!startTime || !endTime) {
    setState({ formErr: 'Both start and end times are required' });
    return;
  }

  const payload = { startTime: new Date(startTime).toISOString(), endTime: new Date(endTime).toISOString(), eventType };
  if (eventType === 'LUNCH') {
    Object.assign(payload, readLunchDetailsFields('postSlot'));
    const repeat = document.getElementById('postSlotRepeat').value;
    if (repeat) payload.repeatInterval = repeat;
    const daysOfWeek = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY']
      .filter(d => document.getElementById('postSlotDay-' + d).checked);
    if (daysOfWeek.length) payload.daysOfWeek = daysOfWeek;
  }

  btn.disabled = true; btn.textContent = 'Posting…';
  try {
    const res = await api('/api/slots', { method: 'POST', body: JSON.stringify(payload) });
    alert(res.created > 1 ? `${res.created} lunches posted!` : 'Slot posted!');
    setState({ screen: 'dashboard' });
  } catch (err) {
    setState({ formErr: err.message });
  }
}

    render();
  } catch (err) {}
}

window.changeCalendarMonth = function(delta) {
  calendarMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + delta, 1);
  calendarSelectedDay = null;
  render();
};

window.selectCalendarDay = function(day) {
  calendarSelectedDay = day;
  render();
};

window.toggleCalendarSync = async function() {
  const box = document.getElementById('calendarSyncBox');
  if (!box) return;
  if (box.innerHTML.trim()) {
    box.innerHTML = '';
    return;
  }
  box.innerHTML = '<p style="font-size:13px;color:var(--slate);margin-bottom:16px;">Loading your link…</p>';
  try {
    const { url, webcalUrl } = await api('/api/bookings/calendar-link');
    box.innerHTML = `
      <div class="card" style="margin-bottom:20px;">
        <p style="font-size:13px;font-weight:600;margin-bottom:6px;">Your private calendar link</p>
        <p style="font-size:12.5px;color:var(--slate);margin-bottom:10px;">Add this once and your confirmed visits will keep showing up automatically — no need to re-add it.</p>
        <input type="text" readonly value="${url}" onclick="this.select()" style="margin-bottom:10px;font-family:'IBM Plex Mono',monospace;font-size:12px;">
        <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;align-items:center;">
          <button type="button" class="link" style="width:auto;margin:0;" onclick="copyCalendarLink('${url}')">📋 Copy link</button>
          <a href="${webcalUrl}" style="font-size:13px;color:var(--teal);text-decoration:underline;">📱 Open in Apple Calendar</a>
        </div>
        <p style="font-size:12px;color:var(--slate);line-height:1.6;">
          <strong>Apple Calendar (iPhone/Mac):</strong> tap "Open in Apple Calendar" above, or in the Calendar app go to Settings → Add Account → Other → Add Subscribed Calendar, and paste the link.<br><br>
          <strong>Google Calendar:</strong> on Google Calendar's website, click the "+" next to "Other calendars" → "From URL", and paste the link.
        </p>
      </div>`;
  } catch (err) {
    box.innerHTML = `<div class="msg err">${err.message}</div>`;
  }
};

window.copyCalendarLink = function(url) {
  navigator.clipboard.writeText(url)
    .then(() => alert('Link copied'))
    .catch(() => alert('Could not copy automatically — tap the link field above and select the text instead.'));
};

async function loadTransfers() {
  const incomingBox = document.getElementById('incomingBox');
  const outgoingBox = document.getElementById('outgoingBox');
  try {
    const incoming = await api('/api/transfers/incoming');
    incomingBox.innerHTML = incoming.length ? incoming.map(t => `
      <div class="row">
        <div class="time">${fmtTime(t.booking.slot.startTime)}</div>
        <div class="mid">
          <div class="who">${t.booking.slot.location.name}</div>
          <div class="what">from ${t.fromRep.name} · ${t.fromRep.companyName}</div>
        </div>
        <button style="background:#E8F5E9;color:#2D6F5E;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;" onclick="decideTransfer('${t.id}','accept')">✓ Accept</button>
        <button style="background:#FDEAEA;color:#C23C3C;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;" onclick="decideTransfer('${t.id}','decline')">✕ Decline</button>
      </div>`).join('') : '<div class="empty">No incoming transfers.</div>';
  } catch (err) {
    incomingBox.innerHTML = `<div class="msg err" style="margin:14px;">${err.message}</div>`;
  }

  try {
    const outgoing = await api('/api/transfers/outgoing');
    outgoingBox.innerHTML = outgoing.length ? outgoing.map(t => `
      <div class="row">
        <div class="time">${fmtTime(t.booking.slot.startTime)}</div>
        <div class="mid">
          <div class="who">${t.booking.slot.location.name}</div>
          <div class="what">${t.toRep ? `to ${t.toRep.name} · ${t.toRep.companyName}` : `to ${t.toRepEmail} — not signed up yet, invited by email`}</div>
        </div>
        <span class="chip ${t.status}">${t.status}</span>
      </div>`).join('') : '<div class="empty">No outgoing transfers.</div>';
  } catch (err) {
    outgoingBox.innerHTML = `<div class="msg err" style="margin:14px;">${err.message}</div>`;
  }
}

window.decideTransfer = async function(id, decision) {
  try {
    await api('/api/transfers/' + id + '/decide', { method: 'POST', body: JSON.stringify({ decision }) });
    loadTransfers();
  } catch (err) {
    alert(err.message);
  }
};

window.offerTransfer = async function(bookingId) {
  const toRepEmail = prompt("Transfer this booking to which rep? Enter their email — they don't need an Arrowhead Access account yet:");
  if (!toRepEmail) return;
  try {
    const transfer = await api('/api/transfers', { method: 'POST', body: JSON.stringify({ bookingId, toRepEmail }) });
    alert(transfer.toRepId
      ? 'Transfer offered — they can accept or decline it from their Transfers screen.'
      : "Transfer offered — they don't have an account yet, so we emailed them an invite to sign up and accept it.");
  } catch (err) {
    alert(err.message);
  }
};

window.decide = async function(id, decision) {
  try {
    await api('/api/bookings/' + id + '/decide', { method: 'POST', body: JSON.stringify({ decision }) });
    loadOfficeLedger();
  } catch (err) {
    alert(err.message);
  }
};

window.goToCheckout = async function(plan) {
  try {
    const billingCycle = plan === 'annual' ? 'ANNUAL' : 'MONTHLY';
    const res = await api('/api/billing/rep/checkout', { method: 'POST', body: JSON.stringify({ billingCycle }) });
    window.open(res.url, '_blank');
  } catch (err) {
    alert(err.message);
  }
};

// ========== RENDER ==========
function render() {
  const app = document.getElementById('app');
  const logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) logoutBtn.style.display = state.screen === 'role' ? 'none' : 'block';
  document.body.classList.toggle('medical-bg', ['role', 'login', 'forgotPassword', 'resetPassword', 'terms', 'privacy'].includes(state.screen));

  if (state.screen === 'role') app.innerHTML = screenRole();
  else if (state.screen === 'terms') app.innerHTML = screenTerms();
  else if (state.screen === 'privacy') app.innerHTML = screenPrivacy();
  else if (state.screen === 'login') app.innerHTML = screenLogin();
  else if (state.screen === 'forgotPassword') app.innerHTML = screenForgotPassword();
  else if (state.screen === 'resetPassword') app.innerHTML = screenResetPassword();
  else if (state.screen === 'signup') { app.innerHTML = screenSignup(); renderTurnstile(); }
  else if (state.screen === 'profile') { app.innerHTML = screenProfile(); initProfileScreen(); }
  else if (state.screen === 'officeSettings') { app.innerHTML = screenOfficeSettings(); loadEmployees(); loadLocationsSettings(); loadOfficePolicy(); loadRecurringTemplates(); }
  else if (state.screen === 'officeStaff') { app.innerHTML = screenOfficeStaff(); }
  else if (state.screen === 'reviewVisit') { app.innerHTML = screenReviewVisit(); renderStarRating(); }
  else if (state.screen === 'accountSettings') { app.innerHTML = screenAccountSettings(); }
  else if (state.screen === 'postSlot') { app.innerHTML = screenPostSlot(); loadRecurringTemplates().then(prefillPostSlotTimeForEventType); }
  else if (state.screen === 'browseSlots') { app.innerHTML = screenBrowseSlots(); loadOpenSlots(); }
  else if (state.screen === 'transfers') { app.innerHTML = screenTransfers(); loadTransfers(); }
  else if (state.screen === 'messages') { app.innerHTML = screenMessages(); loadConversations(); }
  else if (state.screen === 'conversation') { app.innerHTML = screenConversation(); loadConversationMessages(); }
  else if (state.screen === 'literature') { app.innerHTML = screenLiterature(); loadLiterature(); }
  else if (state.screen === 'materials') { app.innerHTML = screenMaterials(); loadMaterials(); }
  else if (state.screen === 'attendance') { app.innerHTML = screenAttendance(); loadAttendees(); }
  else if (state.screen === 'calendar') { app.innerHTML = screenCalendar(); }
  else if (state.screen === 'dashboard' && state.role === 'office') { app.innerHTML = screenDashboardOffice(); loadOfficeLedger(); loadLocationSwitcher(); }
  else if (state.screen === 'dashboard' && state.role === 'rep') { app.innerHTML = screenDashboardRep(); loadMyBookings(); loadBillingStatus(); }
  else if (state.screen === 'visitHistory' && state.role === 'office') { app.innerHTML = screenVisitHistory(); loadOfficeHistory(); }
  else if (state.screen === 'visitHistory' && state.role === 'rep') { app.innerHTML = screenVisitHistory(); loadRepHistory(); }

  const billingParam = new URLSearchParams(window.location.search).get('billing');
  if (billingParam === 'success') { setTimeout(() => alert('Subscription started! Your 14-day free trial has begun.'), 300); }
  else if (billingParam === 'cancelled') { setTimeout(() => alert('Checkout cancelled — no charge was made.'), 300); }
}

// Init
const resetTokenParam = new URLSearchParams(window.location.search).get('resetToken');
const transferParam = new URLSearchParams(window.location.search).get('transfer');
const transferEmailParam = new URLSearchParams(window.location.search).get('email');
if (resetTokenParam) {
  state.resetToken = resetTokenParam;
  state.screen = 'resetPassword';
  render();
} else if (localStorage.getItem('token')) {
  api('/api/auth/me').then(async me => {
    if (me.role === 'rep') {
      state.me = await api('/api/profile/rep');
      state.role = 'rep';
    } else {
      state.me = { id: me.sub, role: me.role === 'office_admin' ? 'ADMIN' : 'STAFF', locationId: me.locationId };
      state.role = 'office';
    }
    state.screen = 'dashboard';
    render();
  }).catch(() => {
    localStorage.removeItem('token');
    render();
  });
} else if (transferParam === '1' && transferEmailParam) {
  pendingTransferEmail = transferEmailParam;
  state.screen = 'signup';
  state.role = 'rep';
  render();
} else {
  render();
}
</script>
</body>
</html>
