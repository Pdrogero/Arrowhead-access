<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrowhead Access — App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --teal: #2D6F5E; --coral: #E8684A; --slate: #6B7280; --line: #E5E7EB; --ink: #1F2937; --paper: #FAFAFA; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--paper); color: var(--ink); }
    .wrap { max-width: 480px; margin: 0 auto; padding: 32px 20px 20px; }
    h1 { font-size: 26px; margin-bottom: 6px; }
    p.sub { color: var(--slate); font-size: 14px; margin-bottom: 22px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 26px; }
    input { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; margin-bottom: 12px; }
    button.primary { width: 100%; background: var(--ink); color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 12px; }
    button.link { width: 100%; background: none; border: none; color: var(--teal); font-size: 12px; margin-bottom: 10px; cursor: pointer; }
    .msg.err { background: #FDEAEA; color: #C23C3C; padding: 10px; border-radius: 8px; margin-bottom: 12px; }
  </style>
</head>
<body>
<div id="app"></div>

<script>
const API_BASE = 'https://arrowhead-access-api.onrender.com';

let state = { screen: 'role', role: null, me: null, formErr: null };

async function api(path, options = {}) {
  const token = localStorage.getItem('token');
  const headers = { 'Content-Type': 'application/json', ...(token ? { 'Authorization': 'Bearer ' + token } : {}) };
  const res = await fetch(API_BASE + path, { ...options, headers: { ...headers, ...options.headers } });
  if (!res.ok) {
    const error = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(error.error || error.message || 'API error');
  }
  return res.json();
}

function setState(updates) {
  Object.assign(state, updates);
  render();
}

function render() {
  const app = document.getElementById('app');
  
  if (state.screen === 'role') {
    app.innerHTML = '<div class="wrap"><h1>Welcome to Arrowhead Access</h1><p class="sub">OpenTable for medical sales visits.</p><button class="primary" onclick="goToOfficeLogin()">Office</button><button class="primary" style="background:var(--coral);" onclick="goToRepLogin()">Sales Rep</button></div>';
  }
  else if (state.screen === 'login') {
    const isOffice = state.role === 'office';
    const email = isOffice ? 'staff@meridianfamilypractice.com' : '';
    const pwd = isOffice ? 'demo1234' : '';
    app.innerHTML = '<div class="wrap"><button class="link" onclick="goHome()" style="text-align:left;margin-bottom:16px;">← Back</button><h1>' + (isOffice ? 'Office Login' : 'Rep Login') + '</h1><div class="card">' + (state.formErr ? '<div class="msg err">' + state.formErr + '</div>' : '') + '<input id="email" type="email" placeholder="Email" value="' + email + '"><input id="password" type="password" placeholder="Password" value="' + pwd + '"><button class="primary" onclick="doLogin()">Log In</button></div></div>';
  }
  else if (state.screen === 'signup') {
    if (state.role === 'office') {
      app.innerHTML = '<div class="wrap"><button class="link" onclick="goHome()" style="text-align:left;margin-bottom:16px;">← Back</button><h1>Create Office Account</h1><div class="card">' + (state.formErr ? '<div class="msg err">' + state.formErr + '</div>' : '') + '<input id="officeName" type="text" placeholder="Office name"><input id="locationName" type="text" placeholder="Location name"><input id="address" type="text" placeholder="Address"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="primary" onclick="doOfficeSignup()">Create Account</button></div></div>';
    } else {
      app.innerHTML = '<div class="wrap"><button class="link" onclick="goHome()" style="text-align:left;margin-bottom:16px;">← Back</button><h1>Create Rep Account</h1><div class="card">' + (state.formErr ? '<div class="msg err">' + state.formErr + '</div>' : '') + '<input id="name" type="text" placeholder="Full name"><input id="companyName" type="text" placeholder="Company name"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="primary" onclick="doRepSignup()">Create Account</button></div></div>';
    }
  }
  else if (state.screen === 'dashboard' && state.role === 'office') {
    app.innerHTML = '<div class="wrap"><h1>Office Dashboard</h1><p class="sub">Logged in as ' + (state.me?.email || '') + '</p><button class="link" onclick="logout()">Log Out</button><div style="border:1px solid #E5E7EB;border-radius:14px;padding:20px;text-align:center;color:#6B7280;">Ledger loading...</div></div>';
  }
  else if (state.screen === 'dashboard' && state.role === 'office') {
    app.innerHTML = '<div class="wrap"><h1>Office Ledger</h1><p class="sub">Logged in as ' + (state.me?.email || '') + '</p><button class="link" onclick="setState({screen:\'officeSettings\'})" style="text-align:left;margin-bottom:10px;">⚙️ Office Settings</button><button class="link" onclick="logout()">Log Out</button><div id="ledgerBox" style="border:1px solid #E5E7EB;border-radius:14px;margin-top:20px;"><div style="padding:20px;text-align:center;color:#6B7280;">Loading…</div></div></div>';
    loadOfficeLedger();
  }
  }
}

function goHome() { setState({ screen: 'role', role: null, formErr: null }); }
function goToOfficeLogin() { setState({ screen: 'login', role: 'office', formErr: null }); }
function goToRepLogin() { setState({ screen: 'login', role: 'rep', formErr: null }); }
function logout() { localStorage.removeItem('token'); goHome(); }

async function doLogin() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const endpoint = state.role === 'office' ? '/api/auth/staff/login' : '/api/auth/rep/login';
  try {
    const res = await api(endpoint, { method: 'POST', body: JSON.stringify({ email, password }) });
    localStorage.setItem('token', res.token);
    state.me = res;
    setState({ screen: 'dashboard', role: state.role });
  } catch (err) {
    setState({ formErr: err.message });
  }
}

async function doRepSignup() {
  const name = document.getElementById('name').value;
  const companyName = document.getElementById('companyName').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  try {
    const res = await api('/api/auth/rep/signup', { method: 'POST', body: JSON.stringify({ name, companyName, email, password }) });
    localStorage.setItem('token', res.token);
    state.me = res;
    setState({ screen: 'dashboard', role: 'rep' });
  } catch (err) {
    setState({ formErr: err.message });
  }
}

async function doOfficeSignup() {
  const officeName = document.getElementById('officeName').value;
  const locationName = document.getElementById('locationName').value;
  const address = document.getElementById('address').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  try {
    const res = await api('/api/auth/office/signup', { method: 'POST', body: JSON.stringify({ officeName, locationName, address, email, password }) });
    localStorage.setItem('token', res.token);
    state.me = res;
    setState({ screen: 'dashboard', role: 'office' });
  } catch (err) {
    setState({ formErr: err.message });
  }
}

if (localStorage.getItem('token')) {
  api('/api/profile/rep').then(me => {
    state.me = me;
    state.role = 'rep';
    state.screen = 'dashboard';
    render();
  }).catch(() => {
    api('/api/bookings/locations/clznrmxov0000o8g8w8wxplk0/ledger').then(() => {
      state.role = 'office';
      state.screen = 'dashboard';
      render();
    }).catch(() => {
      localStorage.removeItem('token');
      render();
    });
  });
} else {
  render();
}
</script>
</body>
</html>
